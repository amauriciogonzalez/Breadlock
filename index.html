<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Breadlock Stats: compare Deadlock players, matches, heroes, and team performance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#080a0e">
<title>Breadlock Stats</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#080a0e;--bg2:#10131a;--bg3:#171b24;--bg4:#22263100;
  --acc:#f0b429;--acc2:#c8891a;--acc3:#ffd060;
  --teal:#34d9c3;--red:#ff7070;--blue:#74b3ff;--grn:#5aee8a;--pur:#c084fc;
  --bdr:#222836;--bdr2:#2f3649;
  --txt:#f0f2fa;--txt2:#c3c9dc;--txt3:#8d97b0;--sub:#4a5168;
  --ff:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --r:5px;--r2:8px;
}
body{background:var(--bg);color:var(--txt);font-family:var(--ff);font-size:15px;min-height:100vh;line-height:1.4;padding-inline:clamp(12px,3vw,28px);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.pbar,.filters,.tabs,.main{width:100%;max-width:1600px;margin-inline:auto}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
/* Header */
.hdr{background:var(--bg2);border-bottom:2px solid var(--bdr);margin-inline:calc(-1 * clamp(12px,3vw,28px));padding:13px clamp(20px,4vw,44px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:3px;color:var(--acc);text-transform:uppercase}
.logo em{color:var(--txt3);font-style:normal}
.hsub{font-size:11px;color:var(--txt3);font-family:var(--fm);margin-left:auto}
/* Player bar */
.pbar{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:10px 18px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.row{display:flex;align-items:center;gap:6px}
.lbl{font-size:11px;color:var(--txt3);white-space:nowrap;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
input[type=text]{background:var(--bg3);border:1px solid var(--bdr);color:var(--txt);padding:6px 10px;border-radius:var(--r);font-family:var(--fm);font-size:12px;outline:none;transition:border .15s}
input[type=text]:focus{border-color:var(--acc)}
input[type=text]::placeholder{color:var(--sub)}
.btn{background:var(--bg3);border:1px solid var(--bdr2);color:var(--txt2);padding:6px 13px;border-radius:var(--r);cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.5px;transition:all .15s;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btna{background:rgba(240,180,41,.2);border-color:var(--acc);color:var(--acc3)}
.btna:hover{background:rgba(240,180,41,.35);color:#fff}
.btnsm{padding:4px 9px;font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:4px 8px;font-size:11px;font-family:var(--fm);max-width:200px}
.chip.cerr{border-color:rgba(255,112,112,.4)}
.chip .cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;color:var(--txt2)}
.chip .crm{color:var(--sub);cursor:pointer;font-size:15px;line-height:1;margin-left:2px;flex-shrink:0}
.chip .crm:hover{color:var(--red)}
.chip .cld{color:var(--txt3);font-size:11px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* Tabs */
.tabs{background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;padding:0 18px;overflow-x:auto}
.tab{padding:10px 12px;font:700 12px var(--ff);letter-spacing:.5px;color:var(--txt3);cursor:pointer;border:0;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;background:none;flex-shrink:0}
.tab svg{width:16px;height:16px;flex-shrink:0}
.tab:hover{color:var(--txt2)}
.tab.on{color:var(--txt);border-bottom-color:var(--acc)}
.tab.on svg{color:var(--acc)}
.tab[data-t="debug"]{margin-left:auto}
.tab:focus-visible{outline:2px solid var(--acc);outline-offset:-3px}
/* Main */
.main{padding:16px;display:flex;flex-direction:column;gap:14px;min-height:200px}
.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:60px 20px;color:var(--txt3)}
.eico{font-size:40px;opacity:.18}
.etxt{font-size:17px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--txt2)}
.esub{font-size:13px;font-family:var(--fm);color:var(--sub)}
/* Grids */
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.combat-charts{grid-template-columns:repeat(2,minmax(0,1fr))}
.combat-charts>.card{min-width:0}
@media(max-width:800px){.combat-charts{grid-template-columns:1fr}}
.performance-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.performance-tables>.card{min-width:0}
.performance-mvp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.performance-mvp-cards>.card{min-width:0}
@media(max-width:900px){.performance-tables{grid-template-columns:1fr}}
@media(max-width:500px){.performance-mvp-cards{grid-template-columns:1fr}}
/* Cards */
.card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px}
.ct{font-size:10px;letter-spacing:2px;color:var(--txt3);text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:6px;font-weight:700}
.ct::before{content:'';width:10px;height:2px;background:var(--acc);flex-shrink:0}
/* Player metric rows */
.pmr{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--bg3)}
.pmr:last-child{border-bottom:none}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pn{flex:1;font-size:13px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bw{width:80px;background:var(--bg3);border-radius:2px;height:4px;overflow:hidden;flex-shrink:0}
.bf{height:4px;border-radius:2px}
.pv{font-family:var(--fm);font-size:13px;font-weight:700;min-width:56px;text-align:right;color:var(--txt);flex-shrink:0}
/* Charts */
.cw{position:relative;width:100%;height:220px}
.cwl{position:relative;width:100%;height:300px}
.progress-controls{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--txt2);font-size:13px}
.progress-controls select{background:var(--bg3);border:1px solid var(--bdr2);border-radius:5px;color:var(--txt);font:12px var(--ff);padding:6px 8px;cursor:pointer}
.progress-controls select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.progress-legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.progress-legend-label{font-size:12px;color:var(--txt3);margin-right:4px}
.progress-person{display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--bdr2);border-radius:5px;color:var(--txt);padding:6px 9px;cursor:pointer;font:12px var(--ff)}
.progress-person[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.progress-person:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.progress-dot{width:10px;height:10px;border-radius:50%;flex:none}
.progress-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.progress-grid>.card{min-width:0}
.progress-rank-section{margin-bottom:32px;padding-bottom:26px;border-bottom:1px solid var(--bdr2)}
.progress-rank-section>.note{margin:0 0 12px}
.progress-rank-section>.slbl,.progress-individual-section>.slbl{margin:0 0 14px}
.progress-chart{position:relative;height:275px}
@media(max-width:850px){.progress-grid{grid-template-columns:1fr}}
/* Tables */
.st{width:100%;border-collapse:collapse;font-size:13px}
.st th{color:var(--txt3);padding:6px 9px;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--bdr2);white-space:nowrap;font-weight:700}
.st th.r{text-align:right}
.st th.l{text-align:left}
.st td{padding:6px 9px;border-bottom:1px solid var(--bg3);color:var(--txt2);vertical-align:middle}
.st td.r{font-family:var(--fm);text-align:right;color:var(--txt);font-size:13px}
.st td.award-place{white-space:nowrap;font-variant-numeric:tabular-nums}
.award-pair{display:grid;grid-template-columns:minmax(2ch,auto) 6ch;gap:6px;justify-content:end;align-items:baseline}
.award-pair .award-rate{color:var(--acc3);font-size:13px;font-weight:700}
.st tr:last-child td{border-bottom:none}
.st tr:hover td{background:var(--bg3)}
.bwin{color:var(--grn);font-size:11px;font-family:var(--fm);background:rgba(90,238,138,.1);border:1px solid rgba(90,238,138,.3);padding:2px 6px;border-radius:3px;white-space:nowrap}
.bloss{color:var(--red);font-size:11px;font-family:var(--fm);background:rgba(255,112,112,.1);border:1px solid rgba(255,112,112,.25);padding:2px 6px;border-radius:3px}
.nd{color:var(--sub);font-size:13px;font-family:var(--fm);text-align:center;padding:18px}
.errbx{color:var(--red);font-size:13px;font-family:var(--fm);background:rgba(255,112,112,.07);border:1px solid rgba(255,112,112,.2);border-radius:var(--r);padding:9px 12px}
.ldbx{color:var(--txt3);font-size:13px;font-family:var(--fm);padding:4px 0}
.load-status{background:var(--bg2);border:1px solid var(--bdr2);border-radius:var(--r2);padding:14px;display:grid;gap:10px}
.load-summary{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--txt2);font-family:var(--fm)}
.load-summary strong{color:var(--acc3)}
.load-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:9px}
.load-item{min-width:0;font:11px var(--fm);color:var(--txt3)}
.load-item-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.load-item-head span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt2)}
.load-track{height:7px;background:var(--bg3);border-radius:6px;overflow:hidden}
.load-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc),var(--teal));transition:width .25s ease}
.load-fill.indeterminate{width:35%;animation:load-slide 1.4s ease-in-out infinite}
@keyframes load-slide{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
@media(prefers-reduced-motion:reduce){.load-fill.indeterminate{animation:none;width:100%;opacity:.5}.load-fill{transition:none}}
/* Hero rows */
.hrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bg3)}
.hrow:last-child{border-bottom:none}
.hico{width:28px;height:28px;border-radius:4px;background:var(--bg3);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--txt3);overflow:hidden;flex-shrink:0}
.hico img{width:100%;height:100%;object-fit:cover}
.tico{width:26px;height:26px;margin:auto;border-radius:4px}
.tico img{display:block;width:100%;height:100%;object-fit:cover}
.hnm{flex:1;font-size:13px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hwr{font-family:var(--fm);font-size:13px;font-weight:700;min-width:38px;text-align:right;flex-shrink:0}
.hgm{font-family:var(--fm);font-size:11px;color:var(--txt3);min-width:28px;text-align:right;flex-shrink:0}
.wrbar{width:52px;background:var(--bg3);border-radius:2px;height:3px;flex-shrink:0}
.wrfl{height:3px;border-radius:2px;background:var(--teal)}
.hsorts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.hsorts .btn{padding:7px 14px;font-size:11px}
.hcell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-width:170px}
.hcell .tico{margin:0}
.hrowx{align-items:center;padding:10px 0;gap:10px}
.hrowx .hico{width:34px;height:34px}
.hmain{flex:1;min-width:0}
.hmain .hnm{font-size:14px;color:var(--txt);font-weight:700;margin-bottom:5px}
.hsubstats{display:flex;flex-wrap:wrap;gap:5px;font-family:var(--fm);font-size:11px;color:var(--txt2);line-height:1.2}
.hmet{background:rgba(255,255,255,.035);border:1px solid var(--bdr);border-radius:3px;padding:2px 5px;white-space:nowrap}
.hmet strong{color:var(--txt);font-weight:700}
.hst td{padding:7px 8px}
.hst .hcell{min-width:140px}
.hero-leaderboard{margin-bottom:8px}
.hero-split{margin:26px 0 10px;padding-top:18px;border-top:1px solid var(--bdr2);color:var(--acc)}
.hero-player-grid{margin-top:0;grid-template-columns:minmax(0,1fr)}
.hrowx .wrbar{width:64px;height:5px;margin-top:15px}
.hrowx .wrfl{height:5px}
.hrowx .hwr{font-size:14px;min-width:44px;margin-top:10px}
.hrowx .hgm{font-size:12px;line-height:1.35;min-width:42px}
/* Rankings */
.rank-scroll{overflow-x:auto}
.rank-mode{display:inline-flex;gap:6px;letter-spacing:normal;text-transform:none}
.rank-mode .btn{padding:5px 11px;font-size:11px}
.rank-card>.ct{flex-wrap:wrap}
.rank-window{display:inline-flex;align-items:center;gap:7px;margin-left:auto;letter-spacing:normal;text-transform:none;white-space:nowrap}
.rank-window select{background:var(--bg3);border:1px solid var(--bdr2);border-radius:5px;color:var(--txt);font:12px var(--ff);padding:6px 8px;cursor:pointer}
.rank-window select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rank-window-note{margin:0 0 10px;font-size:11px;color:var(--txt3)}
.rank-window-warning{color:var(--acc3)}
.rank-table .rank-hero{white-space:nowrap;color:var(--txt3);font-size:11px}
.rank-table .rank-hero .hcell{display:inline-flex;align-items:center}
.rank-table{min-width:1400px}
.rank-table.best-heroes{min-width:1300px;table-layout:fixed}
.rank-table.best-heroes th,.rank-table.best-heroes td{padding-inline:5px}
.rank-table.best-heroes th{white-space:normal;overflow-wrap:normal;letter-spacing:0;line-height:1.25}
.rank-table.best-heroes th:nth-child(1){width:34px}
.rank-table.best-heroes th:nth-child(2){width:62px}
.rank-table.best-heroes th:nth-child(3){width:125px}
.rank-table.best-heroes th:nth-child(4){width:140px}
.rank-table.best-heroes th:nth-child(5){width:115px}
.rank-table.best-heroes th:nth-child(6){width:124px}
.rank-table.best-heroes .rank-player,.rank-table.best-heroes .rank-hero{overflow:hidden;text-overflow:ellipsis}
.rank-table.best-heroes .rank-hero .hcell{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rank-table.best-heroes .rank-select{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rank-table.best-heroes .rank-score{gap:4px;white-space:nowrap}
.rank-table.best-heroes .rank-track{width:40px;flex-shrink:1}
.rank-table td{padding:11px 9px}
.rank-table .rank-player{font-weight:700;color:var(--txt);white-space:nowrap}
.rank-table .rank-api-badge{min-width:140px;white-space:nowrap;text-align:left}
.rank-select{border:1px solid transparent;border-radius:5px;background:transparent;color:var(--txt);font:inherit;font-weight:700;cursor:pointer;padding:5px 7px;text-align:left;white-space:nowrap}
.rank-select:hover,.rank-select[aria-pressed="true"]{border-color:var(--acc2);background:var(--bg3);color:var(--acc3)}
.rank-select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rank-compare{padding:20px clamp(14px,3vw,32px);border-top:1px solid var(--bdr2)}
.rank-compare-prompt{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rank-compare-prompt strong{color:var(--txt);font-size:13px}
.rank-compare-prompt .note{margin-left:auto}
.rank-compare-step{font:700 12px var(--fm);color:var(--acc3);background:rgba(240,180,41,.12);border:1px solid var(--acc2);border-radius:5px;padding:6px 9px}
.rank-compare>.ct{margin-bottom:8px}
.rank-compare h3{font-size:19px;overflow-wrap:anywhere}
.rank-compare .chem-score-card{margin-bottom:14px}
.rank-compare .chem-category{margin-top:12px}
.rank-compare .chem-stat small{display:block;color:var(--txt3);font-size:11px;line-height:1.4;margin-top:8px}
.rank-compare .chem-bar-fill{min-width:0}
.rank-place{font-family:var(--fm);font-weight:700;color:var(--acc3)!important}
.rank-tier{display:inline-block;min-width:27px;text-align:center;padding:2px 6px;border-radius:4px;font-weight:800;border:1px solid currentColor}
.rank-S{color:var(--acc3)}.rank-A{color:var(--grn)}.rank-B{color:var(--blue)}.rank-C{color:var(--teal)}
.rank-D{color:var(--pur)}.rank-F{color:var(--red)}
.rank-table .rank-boundary td{border-top:2px solid var(--bdr2)}
.rank-score{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-family:var(--fm);font-weight:700;color:var(--txt)}
.rank-track{width:75px;height:6px;background:var(--bg3);border-radius:4px;overflow:hidden}
.rank-fill{height:100%;border-radius:4px}
.rank-score-value{min-width:3.5ch;text-align:right}
.rank-score-trend{display:inline-flex;align-items:center;justify-content:center;min-width:26px;min-height:26px;padding:0 3px;border:0;border-radius:4px;background:transparent;font:700 17px var(--fm);line-height:1;color:var(--txt3);cursor:pointer}
.rank-score-trend.up{color:#a5f0bd}.rank-score-trend.up.strong{color:#23ca76}
.rank-score-trend.down{color:#efd16e}.rank-score-trend.down.medium{color:#ffae60}.rank-score-trend.down.strong{color:var(--red)}
.rank-score-trend:not(button){cursor:default}
.rank-score-trend:is(:hover,[aria-expanded="true"]){background:var(--bdr)}
.rank-score-trend:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.rank-trend-panel{padding:18px 20px;color:var(--txt2);white-space:normal}
.rank-trend-panel h3{color:var(--txt);font-size:16px;margin-bottom:5px}
.rank-trend-panel h4{color:var(--txt3);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:18px 0 8px}
.rank-trend-summary{font:700 24px var(--fm);margin:12px 0 5px}
.rank-trend-summary.up,.rank-trend-number.up{color:var(--grn)}
.rank-trend-summary.down,.rank-trend-number.down{color:var(--red)}
.rank-trend-panel .note{margin:5px 0 12px}
.rank-trend-scores{background:var(--bg2);border:1px solid var(--bdr2);border-radius:6px;padding:12px}
.rank-trend-score-row,.rank-trend-category-row{display:grid;grid-template-columns:90px minmax(0,1fr) 58px;align-items:center;gap:9px;margin:7px 0;font:12px var(--fm)}
.rank-trend-score-row strong,.rank-trend-category-row strong{text-align:right;color:var(--txt)}
.rank-trend-score-track{height:16px;background:var(--bdr);border-radius:4px;overflow:hidden}
.rank-trend-score-fill{display:block;height:100%;border-radius:inherit;background:var(--txt3)}
.rank-trend-score-fill.recent.up{background:var(--grn)}
.rank-trend-score-fill.recent.down{background:var(--red)}
.rank-trend-score-fill.recent.flat{background:var(--blue)}
.rank-trend-factors{display:grid;gap:9px}
.rank-trend-factor{min-width:0;background:var(--bg2);border:1px solid var(--bdr2);border-radius:7px;padding:13px 14px}
.rank-trend-category{min-width:0;background:var(--bg2);border:1px solid var(--bdr2);border-left:3px solid var(--trend-category,var(--bdr2));border-radius:7px;overflow:hidden}
.rank-trend-factor-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px;font-size:12px}
.rank-trend-factor-head strong{color:var(--txt);font:700 13px var(--ff)}
.rank-trend-factor-row{display:grid;grid-template-columns:90px minmax(0,1fr) 62px;align-items:center;gap:9px;margin:6px 0;font:12px var(--fm)}
.rank-trend-factor-row strong{text-align:right;color:var(--txt)}
.rank-trend-factor-track{height:12px;background:var(--bdr);border-radius:4px;overflow:hidden}
.rank-trend-factor-fill{display:block;height:100%;border-radius:inherit;background:var(--txt3)}
.rank-trend-factor-fill.recent.up{background:var(--grn)}
.rank-trend-factor-fill.recent.down{background:var(--red)}

async function calculatePlacements(){

            if(Object.keys(ranks).length!==12)throw Error('Incomplete ranking');
            const teams=Object.fromEntries(match.players.map(player=>[String(player.heroId),player.team]));
            if(Object.keys(teams).length!==12||Object.keys(ranks).some(hero=>![0,1].includes(teams[hero]))||

  if(!accounts.length)return;
  const generation=loadGeneration;

      apiFetch('/players/rank?'+new URLSearchParams({account_ids:accounts.join(',')}),{ttl:5*60*1000,priority:0,staleOnError:true}),

    // Match-info-only metadata is small; don't fetch 12 player rosters for lobby averages.

      const rows=await BreadlockData.metadata(ids.slice(i,i+100),{include_info:'true',include_player_info:'false'},{priority:1});

        if(ids.includes(id))matchAvgBadges.set(id,Number.isInteger(badge)&&badge>0&&badge<=116?badge:null);
      }
    }
  }catch(e){if(generation===loadGeneration)dbg('Historical lobby ranks unavailable: '+e,'wn');}
  finally{if(generation===loadGeneration){ids.forEach(id=>matchAvgPending.delete(id));if(activeTab==='matches')renderMain();}}
}

async function addPlayer(id,label,colorOverride){
  if(!id||players.find(p=>p.id===id))return;

  const p={id,label:label||id,color,loading:true,detailsLoading:false,error:null,matches:null,mvp:{},phase:'Fetching match history',progressDone:0,progressTotal:null};
  const generation=loadGeneration;
  players.push(p);
  renderChips();renderMain();
  dbg('Loading '+p.label+' ('+id+')…');
  try{

      {ttl:5*60*1000,priority:0,staleOnError:true});
    p.matches=Array.isArray(mh)?mh:(mh?.data||[]);
    if(generation!==loadGeneration||!players.includes(p))return;
    p.loading=false;

    p.progressTotal=new Set(p.matches.map(m=>String(m.match_id)).filter(id=>id&&id!=='undefined'&&id!=='null')).size;
    p.progressDone=0;
    if(!p.matches.length)p.error='No match data. Player may be private or not tracked.';
    dbg(p.label+': '+p.matches.length+' matches','ok');

    renderChips();renderMain();
    void refreshMatchAvgBadges();

    startMatchDetails();
    if(p.error)return;
    loadMvp(p);
    if(activeTab==='stages')void refreshStages();
    if(activeTab==='performance')refreshTeamShare();if(activeTab==='individual')refreshIndividual();
  }catch(e){

    dbg(p.label+' match-history failed: '+e,'er');

      e.status>=500||e.name==='TypeError'?'API temporarily unavailable. Try again shortly.':
      'Could not load match history (HTTP '+(e.status||'network error')+').';

function startMatchDetails(){
  // Let the full-roster placement projection fill final stats first. Fetch only
  // gaps (including cached ranks, failed projections and unavailable scores).
  if(players.some(p=>p.loading)||placementLoading||placementNextTimer)return;
  const selected=players.filter(p=>p.detailsLoading&&!p.detailsStarted&&!p.error);
  if(!selected.length)return;
  selected.forEach(p=>{p.detailsStarted=true;});
  const generation=loadGeneration;
  return loadMatchDetails(selected).catch(e=>dbg('Optional match details failed: '+e,'wn')).finally(()=>{
    if(generation!==loadGeneration)return;
    selected.filter(p=>players.includes(p)).forEach(p=>{p.detailsLoading=false;});
    renderChips();renderMain();
    if(activeTab==='stages')void refreshStages();
  });
}

async function loadMatchDetails(selected){
  // Compact placement ranks survive reloads but full final stats do not. Fetch
  // only those ranked games needing details, once per unique match rather than
  // once per player. A single account filter returns all loaded participants.
  const targets=new Map(),found=new Map();
  const accountIds=[...new Set(players.filter(p=>!p.loading&&p.matches?.length)
    .map(p=>String(p.matches.find(m=>m.account_id!=null)?.account_id??p.id)))].sort().join(',');
  for(const p of selected){
    const accountId=String(p.matches?.find(m=>m.account_id!=null)?.account_id??p.id);
    const byMatch=new Map((p.matches||[]).map(m=>[String(m.match_id),m]));
    const ids=[...byMatch.keys()].filter(id=>/^\d+$/.test(id)&&
      (!window.BreadlockPlacement||placementRanks.has(id)));
    p.progressTotal=ids.length;
    p.progressDone=0;found.set(p,0);
    for(const id of ids){
      const match=byMatch.get(id);
      if(match._detail){
        p.progressDone++;
        if(gn(match,'player_damage')!=null)found.set(p,found.get(p)+1);
      }else{
        if(!targets.has(id))targets.set(id,[]);
        targets.get(id).push({p,match,accountId});
      }
    }
  }
  const ids=[...targets.keys()];
  if(ids.length)renderLoadStatus();
  try{
    for(let i=0;i<ids.length;i+=DAMAGE_BATCH_SIZE){
      const batch=ids.slice(i,i+DAMAGE_BATCH_SIZE).filter(id=>targets.get(id).some(({p})=>players.includes(p)));
      if(!batch.length)continue;
      const q=new URLSearchParams({match_ids:batch.join(','),account_ids:accountIds,
        only_filtered_players:'true',include_info:'false',include_player_final_stats:'true',
        limit:String(batch.length)});
      const rows=await BreadlockData.metadata(batch,Object.fromEntries(q),{priority:1});
      const byId=new Map(rows.map(row=>[String(row.match_id),row]));
      for(const id of batch){
        const row=byId.get(id),roster=(row?.players||[]).map(raw=>{
          if(typeof raw!=='string')return raw;
          try{return JSON.parse(raw);}catch(e){return null;}
        }).filter(Boolean);
        for(const {p,match,accountId} of targets.get(id)){
          if(!players.includes(p))continue;
          const detail=roster.find(x=>String(x.account_id)===accountId);
          if(detail){
            if(roster.length===12)match._roster=roster;
            match._detail=detail;
            let stats=detail.final_stats;
            if(typeof stats==='string')try{stats=JSON.parse(stats);}catch(e){stats=null;}
            const damage=gn(stats,'player_damage')??gn(detail,'final_stats_player_damage');
            if(damage!=null){match.player_damage=damage;found.set(p,found.get(p)+1);}
          }
          p.progressDone++;
        }
      }
      renderLoadStatus();renderChips();renderMain();
    }
  }catch(e){dbg('Shared damage metadata unavailable: '+e,'wn');}
  for(const p of selected)if(players.includes(p)){
    p.detailCoverage={found:found.get(p),total:p.progressTotal};
    dbg(p.label+': final stats found for '+found.get(p)+'/'+p.progressTotal+' matches',found.get(p)?'ok':'wn');
  }
}

// Accessors — gf is for schema fields where zero is a valid fallback; gn preserves missing data.
function gf(obj,...keys){for(const k of keys){if(obj&&obj[k]!=null)return+obj[k]||0;}return 0;}
function gn(obj,...keys){for(const k of keys){if(obj&&obj[k]!=null&&obj[k]!==''){const n=+obj[k];if(Number.isFinite(n))return n;}}return null;}

function isWin(m){
  // match_result = winning team index, player_team = this player's team
  return gf(m,'match_result')===gf(m,'player_team');
}

function derive(p,ms=visibleMatches(p)){
  if(!ms.length)return null;
  const n=ms.length;
  const wins=ms.filter(isWin).length;
  const kills=ms.reduce((s,m)=>s+gf(m,'player_kills'),0);
  const deaths=ms.reduce((s,m)=>s+gf(m,'player_deaths'),0);
  const assists=ms.reduce((s,m)=>s+gf(m,'player_assists'),0);
  const nw=ms.reduce((s,m)=>s+gf(m,'net_worth'),0);
  const lh=ms.reduce((s,m)=>s+gf(m,'last_hits'),0);
  const dn=ms.reduce((s,m)=>s+gf(m,'denies'),0);
  const dur=ms.reduce((s,m)=>s+gf(m,'match_duration_s'),0);
  const damageValues=ms.map(m=>gn(m,'player_damage')).filter(v=>v!=null);
  const extra={};for(const key of ['dpm','accuracy','headshot','boss','taken','mitigated','allyHeal','allyBarrier','selfHeal','neutral','creep','healPrevented','teamShare'])extra[key]=validAvg(ms.map(m=>metrics(m)[key]));
  const soulsValues=ms.map(m=>ratio(gn(m,'net_worth'),ratio(gn(m,'match_duration_s'),60))).filter(v=>v!=null);
  const lvl=ms.reduce((s,m)=>s+gf(m,'hero_level'),0);
  const aband=ms.filter(m=>gn(m,'abandoned_time_s')>0||m.team_abandoned===true||String(m.team_abandoned).toLowerCase()==='true'||gf(m,'player_match_outcome')===3).length;
  const avgDur=dur/n||0;
  const kd=deaths?kills/deaths:kills;
  return{
    ...extra,n,wins,losses:n-wins,
    winRate:+(wins/n*100).toFixed(1),
    kda:+(deaths?(kills+assists)/deaths:(kills+assists)).toFixed(2),
    kd:+kd.toFixed(2),
    kills:+(kills/n).toFixed(2),
    deaths:+(deaths/n).toFixed(2),
    assists:+(assists/n).toFixed(2),
    avgNw:Math.round(nw/n),
    damageGame:damageValues.length?Math.round(damageValues.reduce((s,v)=>s+v,0)/damageValues.length):null,
    soulsMin:soulsValues.length?+validAvg(soulsValues).toFixed(1):null,
    avgLh:+(lh/n).toFixed(1),
    avgDen:+(dn/n).toFixed(1),
    avgLvl:+(lvl/n).toFixed(1),
    avgDur:avgDur,
    durMin:Math.floor(avgDur/60),
    durSec:Math.floor(avgDur%60),
    abandons:aband,
    abandRate:+(aband/n*100).toFixed(1),
  };
}

function fk(n){if(n==null||isNaN(n))return'—';n=+n;return n>=1000?(n/1000).toFixed(1)+'K':n%1===0?String(n):n.toFixed(1);}
function fp(n){return n==null?'—':n+'%';}
function f1(n){return n==null||isNaN(n)?'—':(+n).toFixed(1);}
function f2(n){return n==null||isNaN(n)?'—':(+n).toFixed(2);}
function soulsK(n){return n==null||isNaN(n)?'—':(+n/1000).toFixed(1)+'K';}
function pctColor(v){return v>50?'var(--grn)':v<50?'var(--red)':'var(--acc)';}

function heroImage(hid,hero,alt){

function matchDate(m){
  const raw=m?.start_time??m?.match_start_time??m?.timestamp??m?.match_time??m?.date;
  if(raw==null||raw==='')return'—';
  const value=typeof raw==='number'||/^\\d+(\\.\\d+)?$/.test(String(raw))
    ? new Date(Number(raw)<1e12?Number(raw)*1000:Number(raw)) : new Date(raw);
  if(isNaN(value.getTime()))return'—';
  return value.toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
}

// Build sorted stat card. higher=best means sort desc, else asc
function statCard(title, key, allArr, fmtFn, higher=true){
  const rows=allArr.map(x=>({p:x.p,v:x.s[key]!=null&&Number.isFinite(+x.s[key])?+x.s[key]:null}));
  if(!rows.length)return'';
  const sorted=[...rows].sort((a,b)=>a.v==null&&b.v==null?0:a.v==null?1:b.v==null?-1:higher?(b.v-a.v):(a.v-b.v));
  const valid=sorted.filter(x=>x.v!=null);
  const max=Math.max(0,...valid.map(x=>Math.abs(x.v)))||1;
  return`<div class="card"><div class="ct">${title}</div>${sorted.map(x=>`<div class="pmr">
    <span class="pdot" style="background:${x.p.color}"></span>
    <span class="pn">${chemText(x.p.label)}</span>
    <div class="bw"><div class="bf" style="width:${x.v==null?0:Math.max(2,(Math.abs(x.v)/max*100)).toFixed(1)}%;background:${x.p.color}"></div></div>
    <span class="pv">${x.v==null?'—':fmtFn?fmtFn(x.v):x.v}</span>
  </div>`).join('')}</div>`;
}

function loadStatusHtml(){
  const pending=players.filter(p=>p.loading),details=players.filter(p=>p.detailsLoading&&!p.loading),mvp=players.filter(p=>p.mvpPending===scopeKey());
  if(!pending.length&&!details.length&&!mvp.length)return dataNotice?`<div id="load-status" class="note" role="status">${chemText(dataNotice)}</div>`:'';
  const completed=players.length-pending.length;
  const item=(label,detail,done,total)=>{
    const determinate=total!=null&&total>0;
    const pct=determinate?Math.min(100,Math.round(done/total*100)):null;
    return `<div class="load-item"><div class="load-item-head"><span>${chemText(label)}</span><span>${chemText(detail)}</span></div><div class="load-track" role="progressbar" aria-label="${chemText(label+' '+detail)}" ${determinate?`aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"`:''}><div class="load-fill${determinate?'':' indeterminate'}" style="${determinate?'width:'+pct+'%':''}"></div></div></div>`;
  };
  const rows=pending.map(p=>item(p.label,p.phase,0,null));
  rows.push(...details.map(p=>item(p.label,`Optional match details ${p.progressDone}/${p.progressTotal}`,p.progressDone,p.progressTotal)));
  rows.push(...mvp.map(p=>item(p.label,'Official MVP awards…',0,null)));
  return `<div id="load-status" class="load-status" role="status" aria-live="polite">${dataNotice?`<div class="note">${chemText(dataNotice)}</div>`:''}<div class="load-summary"><strong>${pending.length?'Loading player histories':'Loading additional stats in background'}</strong><span>${completed}/${players.length} player histories complete${details.length?' · '+details.length+' detail '+(details.length===1?'request':'requests')+' in progress':''}${mvp.length?' · '+mvp.length+' MVP '+(mvp.length===1?'request':'requests')+' in progress':''}</span></div>${pending.length?`<div class="load-track" role="progressbar" aria-label="Player histories complete" aria-valuenow="${completed}" aria-valuemin="0" aria-valuemax="${players.length}"><div class="load-fill" style="width:${players.length?completed/players.length*100:0}%"></div></div>`:''}<div class="load-list">${rows.join('')}</div></div>`;
}
function renderLoadStatus(){

    el.querySelectorAll('.rank-hero img[data-fallbacks]').forEach(img=>img.addEventListener('error',()=>rotateHeroImage(img)));
  }
  if(activeTab==='heroes'){
    document.querySelectorAll('[data-hero-sort]').forEach(b=>b.addEventListener('click',()=>{heroSort=b.dataset.heroSort;renderMain();}));
  }
  if(activeTab==='individual'){
    el.querySelectorAll('[data-ind-player]').forEach(b=>b.addEventListener('click',()=>{individualId=b.dataset.indPlayer;renderMain();refreshIndividual();}));
    el.querySelectorAll('[data-ind-hero]').forEach(b=>b.addEventListener('click',()=>{individualHero=b.dataset.indHero;renderMain();refreshIndividual();}));
    el.querySelectorAll('[data-ind-rank]').forEach(b=>b.addEventListener('click',()=>{individualRank=b.dataset.indRank;renderMain();refreshIndividual();}));
    el.querySelectorAll('.ind-picker img[data-fallbacks]').forEach(img=>img.addEventListener('error',()=>rotateHeroImage(img)));
  }
  if(activeTab==='progress'){
    el.querySelectorAll('[data-progress-player]').forEach(button=>button.addEventListener('click',()=>{
      const id=button.dataset.progressPlayer;
      if(progressHiddenIds.has(id))progressHiddenIds.delete(id);else progressHiddenIds.add(id);
      button.setAttribute('aria-pressed',String(!progressHiddenIds.has(id)));
      Object.entries(charts).filter(([key])=>key.startsWith('progress-')).forEach(([,chart])=>syncProgressChart(chart));
    }));
    el.querySelector('#progress-show-all')?.addEventListener('click',()=>{
      progressHiddenIds.clear();
      el.querySelectorAll('[data-progress-player]').forEach(button=>button.setAttribute('aria-pressed','true'));
      Object.entries(charts).filter(([key])=>key.startsWith('progress-')).forEach(([,chart])=>syncProgressChart(chart));
    });
    el.querySelector('#rank-progress-window')?.addEventListener('change',e=>{
      rankProgressWindow=Number(e.target.value);renderMain();
      el.querySelector('#rank-progress-window')?.focus({preventScroll:true});
    });
    el.querySelector('#rank-progress-season')?.addEventListener('change',e=>{
      rankProgressSeason=e.target.value;renderMain();
      el.querySelector('#rank-progress-season')?.focus({preventScroll:true});
    });
    el.querySelector('#progress-window')?.addEventListener('change',e=>{
      progressWindow=Number(e.target.value);renderMain();
      el.querySelector('#progress-window')?.focus({preventScroll:true});
    });
  }
  if(activeTab==='chemistry'){
    el.querySelectorAll('[data-chem-person]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.chemPerson;chemistryTeam=chemistryTeam.includes(id)?chemistryTeam.filter(x=>x!==id):chemistryTeam.length<6?[...chemistryTeam,id]:chemistryTeam;renderMain();}));
    el.querySelectorAll('[data-chem-view]').forEach(b=>b.addEventListener('click',()=>{chemistryView=b.dataset.chemView;chemistryPair=null;renderMain();}));
    el.querySelectorAll('[data-chem-pair]').forEach(b=>b.addEventListener('click',()=>{chemistryPair=b.dataset.chemPair;renderMain();}));
    el.querySelector('#chem-sort')?.addEventListener('change',e=>{chemistrySort=e.target.value;renderMain();});
    el.querySelectorAll('.chem-match-row').forEach(row=>{
      const toggle=()=>{const detail=document.getElementById(row.getAttribute('aria-controls'));detail.hidden=!detail.hidden;row.setAttribute('aria-expanded',String(!detail.hidden));};
      row.addEventListener('click',toggle);
      row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
    });
  }
  setTimeout(()=>{if(renderId===chartRenderId)mountCharts(arr);},80);
}

function tabOverview(arr){

  let h='';
  // One leaderboard combines overall rank and the existing overview summary stats.
  const bestHeroes=leaderboardMode==='heroes';
  const ranked=assignRankingTiers(bestHeroes?bestHeroRankings(arr.map(x=>x.p)):rankPlayers(arr.map(x=>x.p)));
  comparedRankIds=comparedRankIds.filter(id=>ranked.some(r=>String(r.p.id)===id));
  const statsByPlayer=new Map(bestHeroes?ranked.map(r=>[r.p,derive(r.p,r.matches)]):arr.map(x=>[x.p,x.s]));

  <table class="st rank-table${bestHeroes?' best-heroes':''}"><thead><tr>
    <th class="l">#</th><th class="l">Tier</th><th class="l">Player</th><th class="l" title="Rank from the player's latest ranked match">Current rank</th>${bestHeroes?'<th class="l">Hero</th>':''}<th class="r" title="Trend: latest ${rankTrendMatches} vs previous ${rankTrendMatches} matches with fixed peers. Down: 1–&lt;3 pts yellow, 3–&lt;6 orange, 6+ red. Up: 1–&lt;6 light green, 6+ deep green. Changes under 1 pt are flat. Displayed score uses full history.">Score</th>
    <th class="r">Games</th><th class="r">W</th><th class="r">L</th><th class="r">Win% (10%)</th>
    <th class="r">Performance (70%)</th><th class="r">KDA</th><th class="r">K/G</th><th class="r">D/G</th><th class="r">A/G</th>
    <th class="r">DMG/G</th><th class="r">Souls/min</th><th class="r" title="Estimated lobby placement contributes 20% of the overall score when available. Its peer-relative score is adjusted toward neutral 50 for incomplete calculated-game coverage; lower place is better. Missing components cause remaining weights to be rescaled.">Avg place (20%)</th><th class="r">Most common</th>
  </tr></thead><tbody>`;
  ranked.forEach((r,i)=>{const s=statsByPlayer.get(r.p),placement=r.placement;
    const place=r.score==null?'—':ranked.findIndex(other=>other.score===r.score)+1;
    h+=`<tr class="rank-entry${i&&r.tier&&r.tier!==ranked[i-1].tier?' rank-boundary':''}">
    <td class="rank-place" data-label="Rank">${place}</td>
    <td class="rank-tier-cell">${r.tier==null?'—':`<span class="rank-tier rank-${r.tier}">${r.tier}</span>`}<button type="button" class="rank-expand rank-expand-${r.tier||'none'}" data-rank-expand="${i}" data-rank-person="${chemText(r.p.id)}" aria-expanded="false" aria-controls="rank-detail-${i}" aria-label="Show score breakdown for ${chemText(r.p.label)}" title="Show score breakdown"></button></td>
    <td class="rank-player"><button type="button" class="rank-select" data-rank-select="${chemText(String(r.p.id))}" aria-pressed="${comparedRankIds.includes(String(r.p.id))}" aria-label="${comparedRankIds.includes(String(r.p.id))?'Remove':'Select'} ${chemText(r.p.label)} for comparison" title="Select two players to compare"><span class="pdot" style="display:inline-block;background:${r.p.color};margin-right:8px"></span>${chemText(r.p.label)}</button></td><td class="rank-api-badge" data-label="Current rank">${rankBadgeHtml(rankAccount(r.p))}</td>
    ${bestHeroes?`<td class="rank-hero">${r.heroId!=null?`<span class="hcell"><span class="hico tico">${heroImage(r.heroId,heroMeta[r.heroId]||{},chemText(heroName(r.heroId)))}</span>${chemText(heroName(r.heroId))}</span>`:'Hero unavailable'}</td>`:''}
    <td class="r rank-score-cell" data-label="Score"><div class="rank-score"><div class="rank-track"><div class="rank-fill" style="width:${r.score==null?0:r.score.toFixed(1)}%;background:${r.p.color}"></div></div><span class="rank-score-value">${f1(r.score)}</span>${scoreTrendHtml(trends.get(r.p),i,r.p)}</div></td>
    <td class="r" data-label="Games">${s.n}</td>
    <td class="r" data-label="Wins" style="color:var(--grn)">${r.wins??'—'}</td>
    <td class="r" data-label="Losses" style="color:var(--red)">${r.losses??'—'}</td>
    <td class="r" data-label="Win% · 10%" ${r.winRate==null?'':`style="color:${pctColor(r.winRate)};font-weight:700"`}>${r.winRate==null?'—':f1(r.winRate)+'%'}</td>
    <td class="r" data-label="Performance · 70%" style="color:var(--acc3)">${f1(r.metricPerformance)}</td>
    <td class="r" data-label="KDA" style="color:var(--acc3)">${f1(r.kda)}</td>
    <td class="r" data-label="Kills/game">${f1(s.kills)}</td>
    <td class="r" data-label="Deaths/game">${f1(s.deaths)}</td>
    <td class="r" data-label="Assists/game">${f1(s.assists)}</td>
    <td class="r" data-label="Damage/game">${fk(r.damageGame)}</td>
    <td class="r" data-label="Souls/min">${soulsK(r.soulsMin)}</td>
    <td class="r" data-label="Avg place · 20%">${f1(placement.average)}</td><td class="r" data-label="Most common">${placementModes(placement)}</td>
  </tr><tr id="rank-detail-${i}" class="rank-detail" hidden><td colspan="${bestHeroes?20:19}">${rankingExplanation(r)}</td></tr>${trends.has(r.p)?`<tr id="rank-trend-detail-${i}" class="rank-detail rank-trend-detail" hidden><td colspan="${bestHeroes?20:19}">${rankingTrendExplanation(trends.get(r.p),i)}</td></tr>`:''}`;});
  h+=`</tbody></table></div>${comparedRankIds.length===2?rankingComparison(...comparedRankIds.map(id=>ranked.find(r=>String(r.p.id)===id)).sort((a,b)=>ranked.indexOf(a)-ranked.indexOf(b))):`<div class="rank-compare rank-compare-prompt"><span class="rank-compare-step">${comparedRankIds.length?'1 / 2':'0 / 2'}</span><strong>${comparedRankIds.length?`${chemText(ranked.find(r=>String(r.p.id)===comparedRankIds[0]).p.label)} selected`:'Compare two players'}</strong></div>`}</div>`;
  // Keep the overview about results and match context; specialist comparisons live in their tabs.
  h+=`<div class="slbl">Results and match context${bestHeroes?' · all heroes':''}</div><div class="g3">`;
  h+=statCard('Win Rate','winRate',arr,v=>v+'%');
  h+=statCard('Total Matches','n',arr);
  h+=statCard('Avg Match Duration','avgDur',arr,v=>{const m=Math.floor(v/60);return m+':'+String(Math.floor(v%60)).padStart(2,'0');});
  h+=statCard('Abandons','abandons',arr,null,false);
  h+=statCard('Abandon Rate','abandRate',arr,v=>v+'%',false);
  h+=`</div>`;
  return h;
}

function rankingComparison(a,b){
  const signed=n=>`${n>=0?'+':'−'}${f2(Math.abs(n))}`;
  const scoreLeader=a.score==null||b.score==null||a.score===b.score?null:a.score>b.score?a:b;
  const summary=(value,label,color)=>`<div class="chem-stat"><strong${color?` style="color:${color}"`:''}>${value}</strong><span>${label}</span></div>`;
  // Allocate the actual stretched core score across available categories using
  // their weighted, stretched standings. This is a visual allocation, not an
  // independent per-category contribution to the ranking formula.
  const scorePieces=r=>{
    const metricWeight=r.scoreWeights.metric/100;
    const available=r.categoryDetails.filter(c=>c.name!=='Support'&&c.effectiveWeight>0);
    const proxies=available.map(c=>c.effectiveWeight/100*scalePerformanceScore(c.rawScore));
    const proxyTotal=proxies.reduce((sum,x)=>sum+x,0);
    const core=r.metricCorePerformance??0;
    const pieces=available.map((c,i)=>({name:c.name,color:CHEM_STATS.find(([name])=>name===c.name)?.[2]||'var(--acc)',
      points:metricWeight*core*(proxyTotal?proxies[i]/proxyTotal:c.effectiveWeight/100)}));
    const bonus=metricWeight*Math.max(0,(r.metricPerformance??0)-core);
    if(bonus>0)pieces.push({name:'Support bonus',color:'#c084fc',points:bonus});
    if(r.placementScore!=null&&r.scoreWeights.placement>0)pieces.push({name:'Estimated place',color:'#ff7eb6',points:r.scoreWeights.placement/100*r.placementScore});
    if(r.winStanding!=null)pieces.push({name:'Win-rate standing',color:'var(--teal)',points:r.scoreWeights.win/100*r.winStanding});
    return pieces;
  };
  const piecesA=scorePieces(a),piecesB=scorePieces(b);
  const scoreRow=(r,pieces)=>`<div class="chem-score-row"><div class="chem-score-head"><span style="color:${r.p.color}">${chemText(r.p.label)}</span><strong>${f1(r.score)} / 100</strong></div><div class="chem-score-track" role="img" aria-label="${chemText(r.p.label)}: ${f1(r.score)} out of 100, broken down by category, support, estimated place, and win-rate standing">${pieces.filter(p=>p.points>0).map(p=>`<span class="chem-score-segment" style="width:${p.points.toFixed(4)}%;background:${p.color}" title="${p.name}: ${f2(p.points)} allocated overall score points"></span>`).join('')}</div></div>`;
  const legend=[...new Set([...piecesA,...piecesB].map(p=>p.name))].map(name=>{
    const item=piecesA.find(p=>p.name===name)||piecesB.find(p=>p.name===name);
    const points=(pieces)=>pieces.find(p=>p.name===name)?.points??0;
    return `<span><i style="background:${item.color}"></i>${chemText(name)}: ${f2(points(piecesA))} / ${f2(points(piecesB))} pts</span>`;
  }).join('');
  const categoryMap=r=>new Map(r.categoryDetails.map(c=>[c.name,c]));
  const ac=categoryMap(a),bc=categoryMap(b);
  const categories=CHEM_STATS.map(([name,description,color,items])=>{
    const ca=ac.get(name),cb=bc.get(name);
    if(!ca&&!cb)return '';
    const leader=ca&&cb&&ca.rawScore!==cb.rawScore?(ca.rawScore>cb.rawScore?a:b):null;
    const metricCards=items.flatMap(([label,,format,direction])=>{
      const left=ca?.metrics.find(m=>m.label===label),right=cb?.metrics.find(m=>m.label===label);
      if(!left&&!right)return [];
      const diff=left&&right?left.score-right.score:null;
      const higher=diff==null||diff===0?null:diff>0?a:b;
      const max=Math.max(left?.mean??0,right?.mean??0,0);
      const bar=(r,m)=>`<div class="chem-bar-row"><span class="chem-bar-name" style="color:${r.p.color}" title="${chemText(r.p.label)}">${chemText(r.p.label)}</span><span>${m?format(m.mean):'—'}</span><div class="chem-bar-track"><div class="chem-bar-fill" style="width:${m&&max?Math.max(0,m.mean/max*100):0}%;background:${r.p.color}"></div></div></div>`;
      return [`<div class="chem-stat" style="--chem-metric:${higher?.p.color||'var(--txt3)'}"><h5 class="chem-metric-title">${chemText(label)}${direction<0?' · lower is better':''}</h5><div class="chem-delta"><strong style="color:${higher?.p.color||'var(--txt2)'}">${diff==null?'—':signed(diff)}</strong><em style="color:${higher?.p.color||'var(--txt3)'}">${higher?chemText(higher.p.label)+' higher peer score':diff===0?'Even peer scores':'Unavailable'}</em></div><div class="chem-bars">${bar(a,left)}${bar(b,right)}</div><small>Peer scores ${f1(left?.score)} / ${f1(right?.score)} · games ${left?.count??0}/${a.n} / ${right?.count??0}/${b.n}${left&&right?` · ${f1(left.effectiveWeight)}% / ${f1(right.effectiveWeight)}% of category`:''}</small></div>`];
    }).join('');
    return `<section class="chem-category" style="--chem-section:${leader?.p.color||color}"><div class="chem-category-head"><h4>${chemText(name)}</h4><p>${description} · peer-relative category score ${f1(ca?.rawScore)} / ${f1(cb?.rawScore)}${name==='Support'?' · bonus only':` · core weight ${coreWeightText(ca?.effectiveWeight)}% / ${coreWeightText(cb?.effectiveWeight)}%`}</p></div><div class="chem-compare">${metricCards}</div></section>`;
  }).join('');
  const bothScored=a.score!=null&&b.score!=null;
  const sameWeights=[a,b].every(r=>r.metricPerformance!=null&&r.placementScore!=null&&r.winStanding!=null);
  return `<section class="rank-compare chem-comparison" style="--chem-overall:${scoreLeader?.p.color||'var(--txt3)'}" aria-label="Leaderboard player comparison"><div class="ct">Leaderboard comparison</div><h3>${chemText(a.p.label)} vs ${chemText(b.p.label)}</h3>
    <div class="chem-summary">${summary(f1(a.score),chemText(a.p.label)+' · tier '+(a.tier||'—'),a.p.color)}${summary(f1(b.score),chemText(b.p.label)+' · tier '+(b.tier||'—'),b.p.color)}${summary(bothScored?f2(a.score-b.score):'—',bothScored?'Overall score gap · pts':'No comparable gap')}${summary(`${a.n} / ${b.n}`,'Selected games')}</div>
    <div class="chem-score-card"><h4>Overall score · full breakdown</h4>${scoreRow(a,piecesA)}${scoreRow(b,piecesB)}<div class="chem-score-legend">${legend}</div><p class="chem-foot" style="margin-top:10px">Avg estimated place (lower is better): ${f1(a.placement.average)} / ${f1(b.placement.average)} · calculated ${a.placement.count}/${a.placement.selected} / ${b.placement.count}/${b.placement.selected} games · win rate ${f1(a.winRate)}% / ${f1(b.winRate)}%.</p>${sameWeights?`<p class="chem-foot" style="margin-top:7px">Score gap: ${signed(.7*(a.metricPerformance-b.metricPerformance))} stat pts + ${signed(.2*(a.placementScore-b.placementScore))} place pts + ${signed(.1*(a.winStanding-b.winStanding))} win pts = ${signed(a.score-b.score)} pts (${chemText(a.p.label)} minus ${chemText(b.p.label)}).</p>`:''}</div>
    <div class="ct">Category & metric breakdown</div>
    ${categories||'<p class="chem-foot">No scored categories are available.</p>'}
    </section>`;
}

function rankingExplanation(r){
  if(r.score==null)return '<div class="rank-explain">No comparable data in this period.</div>';
  const c=r.performanceCoverage,trends=personalTrends(r.p,r.matches),leadingTrend=trends.find(t=>Math.abs(t.change)>=.15);
  const sway=(value)=>`${value>=0?'+':'−'}${f2(Math.abs(value))}`;
  const bar=score=>{const extent=Math.min(50,Math.abs(score-50)*2);
    return `<div class="rank-cat-track" aria-hidden="true"><span class="rank-cat-fill${score<50?' below':''}" style="left:${score<50?50-extent:50}%;width:${extent}%"></span></div>`;
  };
  const categories=r.categoryDetails.map((category,index)=>{
    const score=category.rawScore,best=[...category.metrics].sort((a,b)=>Math.abs(b.score-50)-Math.abs(a.score-50))[0];
    const counts=category.metrics.map(m=>m.count),low=Math.min(...counts),high=Math.max(...counts);
    const isSupport=category.name==='Support';
    const contribution=isSupport?r.supportBonus:(score-50)*category.effectiveWeight/100;
    const metrics=category.metrics.map(m=>{
      const impact=(m.score-50)*category.effectiveWeight*m.effectiveWeight/10000;
      return `<div class="rank-metric"><div class="rank-metric-head"><span>${chemText(m.label)} · ${f1(m.effectiveWeight)}% of category${m.direction<0?' · lower is better':''}</span><strong>${f1(m.score)}</strong></div>${bar(m.score)}
        <p class="note">Your avg ${m.label==='Souls/min'?soulsK(m.mean):f1(m.mean)} · peer avg ${m.label==='Souls/min'?soulsK(m.peerMean):f1(m.peerMean)} (${m.peers} peers)</p>
        <p class="note">${m.count}/${c.games} of your games · peer minimum ${m.peerCount} games</p>
        <div class="rank-sway${impact>0?' positive':impact<0?' negative':''}">${isSupport?'Part of the capped support bonus':sway(impact)+' raw core pts'}</div></div>`;
    }).join('');
    const key=chemText(r.p.id+':'+index);
    return {card:`<div class="rank-cat"><div class="rank-cat-head"><span>${chemText(category.name)} <small>· ${isSupport?'additive bonus (up to +5)':coreWeightText(category.effectiveWeight)+'% core weight'}</small></span><strong>${f1(score)}</strong></div>
      ${bar(score)}<div class="rank-cat-foot"><span>Below peers</span><span>50 · even</span><span>Above peers</span></div>
      <div class="rank-sway${contribution>0?' positive':contribution<0?' negative':''}">${isSupport?'+'+f2(contribution)+' bonus stat pts':sway(contribution)+' raw core pts'}</div>
      <p class="note">${best?`${chemText(best.label)}: ${best.label==='Souls/min'?soulsK(best.mean):f1(best.mean)} vs ${best.label==='Souls/min'?soulsK(best.peerMean):f1(best.peerMean)} peer avg · ${best.count}/${c.games} games`:''}</p>
      <p class="note">Coverage: ${low===high?low:low+'–'+high}/${c.games} games across ${category.metrics.length} ${category.metrics.length===1?'metric':'metrics'}</p>
      <button type="button" class="rank-cat-toggle" data-rank-cat-toggle="${key}" aria-expanded="false" aria-controls="rank-cat-panel-${key}">Show ${category.metrics.length} scored ${category.metrics.length===1?'metric':'metrics'}</button></div>`,
      panel:`<div class="rank-cat-drill" id="rank-cat-panel-${key}" data-rank-cat-panel="${key}" hidden><h4>${chemText(category.name)} · ${category.metrics.length} scored ${category.metrics.length===1?'metric':'metrics'}</h4><div class="rank-metric-grid">${metrics}</div></div>`};
  });
  const allMetrics=r.categoryDetails.filter(category=>category.name!=='Support').flatMap(category=>category.metrics.map(m=>({...m,category:category.name,
    impact:(m.score-50)*category.effectiveWeight*m.effectiveWeight/10000})));
  const eligible=allMetrics.filter(m=>m.count>=Math.min(10,c.games));
  const divergence=(items)=>items.length?items.map(m=>`<div class="rank-edge"><strong>${chemText(m.label)}</strong><small>${chemText(m.category)} · ${f1(m.score)} raw metric score · your avg ${m.label==='Souls/min'?soulsK(m.mean):f1(m.mean)} vs peer avg ${m.label==='Souls/min'?soulsK(m.peerMean):f1(m.peerMean)} · ${m.count}/${c.games} games</small><span class="rank-sway${m.impact>0?' positive':' negative'}">${sway(m.impact)} raw performance pts</span></div>`).join(''):'<p class="note">No qualifying divergences.</p>';
  const strongest=[...eligible].filter(m=>m.impact>0).sort((a,b)=>b.impact-a.impact).slice(0,3);
  const weakest=[...eligible].filter(m=>m.impact<0).sort((a,b)=>a.impact-b.impact).slice(0,3);
  const component=(name,value,weight,kind,detail)=>value==null?'':`<div class="rank-component"><div class="rank-component-head"><span>${name} · ${f1(weight)}%</span><strong>${f1(value)}</strong></div><div class="rank-bar" aria-hidden="true"><div class="rank-bar-fill ${kind}" style="width:${Math.max(0,Math.min(100,value))}%"></div></div><p class="note">${detail}</p></div>`;
  const {metric:metricWeight,placement:placeWeight,win:winWeight}=r.scoreWeights;
  const trendCards=trends.map(t=>{
    const notable=Math.abs(t.change)>=.15,max=Math.max(t.prev,t.now,1);
    return `<div class="rank-trend"><div class="rank-trend-head"><strong>Average ${chemText(t.name.toLowerCase())}</strong><span>${notable?(t.good?'Favorable':'Less favorable')+' change':'Small change'}${leadingTrend===t?' · largest shift':''}</span></div>
      ${[['Older',t.prev,t.old],['Newer',t.now,t.recent]].map(([label,value,n],i)=>`<div class="rank-trend-row"><span>${label} ${n} games</span><div class="rank-bar" aria-hidden="true"><div class="rank-bar-fill" style="width:${Math.max(0,Math.min(100,value/max*100))}%;background:${!i?'var(--txt3)':!notable?'var(--blue)':t.good?'var(--grn)':'var(--red)'}"></div></div><span>${t.name==='Souls/min'?soulsK(value):f1(value)}</span></div>`).join('')}</div>`;

    <h4>Core categories + additive support bonus · stat metrics only</h4><div class="rank-cat-grid">${categories.map(x=>x.card).join('')||'<p class="note">No comparable performance metrics.</p>'}</div>${categories.map(x=>x.panel).join('')}
    <div class="rank-edges"><div class="rank-edge-list"><h4>Biggest positive score sway</h4>${divergence(strongest)}</div><div class="rank-edge-list"><h4>Biggest negative score sway</h4>${divergence(weakest)}</div></div>
    <h4>Older vs newer games · not scored</h4>
    <div class="rank-trend-grid">${trendCards||'<p class="note">Not enough games with usable values in both halves for a personal trend.</p>'}</div>
    <div class="note">${c.details}/${c.games} games with detailed stats</div></div>`;
}
function personalTrends(p,matches=visibleMatches(p)){
  const ms=[...matches].filter(m=>gn(m,'start_time')!=null)
    .sort((a,b)=>gn(a,'start_time')-gn(b,'start_time'));
  if(ms.length<16)return [];
  const half=Math.floor(ms.length/2),old=ms.slice(0,half),recent=ms.slice(-half);
  const candidates=[['Souls/min',m=>ratio(gn(m,'net_worth'),ratio(gn(m,'match_duration_s'),60)),true],
    ['Deaths/game',m=>gn(m,'player_deaths'),false],['Kills/game',m=>gn(m,'player_kills'),true],
    ['Hero damage/min',m=>metrics(m).dpm,true]];
  return candidates.flatMap(([name,get,higher])=>{
    const before=old.map(get).filter(Number.isFinite),after=recent.map(get).filter(Number.isFinite);
    if(before.length<Math.max(8,Math.ceil(half*.75))||after.length<Math.max(8,Math.ceil(half*.75)))return[];
    const prev=validAvg(before),now=validAvg(after),change=(now-prev)/Math.max(Math.abs(prev),1);
    return [{name,prev,now,change,good:(change>0)===higher,old:before.length,recent:after.length}];
  }).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));
}
function personalTrend(p){return personalTrends(p).find(t=>Math.abs(t.change)>=.15)||null;}

// Relative leaderboard, not an opponent-based Elo or an official match MVP rank.
const RANK_METRIC_WEIGHT=70,RANK_PLACEMENT_WEIGHT=20,RANK_WIN_WEIGHT=10;
function scalePerformanceScore(score){return Math.max(0,Math.min(100,50+2.5*(score-50)));}
// At most five stat-performance points; scores at/below the neutral 50 add nothing.
function supportBonus(rawScore){return rawScore==null?0:Math.max(0,scalePerformanceScore(rawScore)-50)/10;}
function rankScoreParts(metric,placement,win){
  const values={metric,placement,win};
  const base={metric:RANK_METRIC_WEIGHT,placement:RANK_PLACEMENT_WEIGHT,win:RANK_WIN_WEIGHT};
  const available=Object.keys(base).filter(key=>values[key]!=null);
  const total=available.reduce((sum,key)=>sum+base[key],0);
  const weights=Object.fromEntries(Object.keys(base).map(key=>[key,total&&values[key]!=null?base[key]/total*100:0]));
  return {weights,score:total?available.reduce((sum,key)=>sum+weights[key]*values[key]/100,0):null};
}
function rankingStats(p,ms=visibleMatches(p)){
  const valid=(fn)=>ms.map(fn).filter(v=>v!=null&&Number.isFinite(v));
  const results=valid(m=>{
    const result=gn(m,'match_result'),team=gn(m,'player_team');
    return result==null||team==null?null:Number(result===team);
  });
  const kda=valid(m=>{
    const k=gn(m,'player_kills'),d=gn(m,'player_deaths'),a=gn(m,'player_assists');
    return k==null||d==null||a==null?null:(k+a)/(d||1);
  });
  const damage=valid(m=>gn(m,'player_damage'));
  const souls=valid(m=>{
    const worth=gn(m,'net_worth'),duration=gn(m,'match_duration_s');
    return worth==null||duration==null||duration<=0?null:worth*60/duration;
  });
  const avg=xs=>xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null;
  const observations=ms.map(m=>({m,ext:metrics(m)}));
  const categories=CHEM_STATS.map(([name,,,items])=>({name,values:items.map(([,get,,direction])=>{
    if(!direction)return null;
    const xs=observations.map(get).filter(v=>v!=null&&Number.isFinite(v));
    return xs.length?{mean:avg(xs),count:xs.length,direction}:null;
  })}));
  const wins=results.length?results.reduce((a,b)=>a+b,0):null;
  return {p,matches:ms,n:ms.length,wins,losses:wins==null?null:results.length-wins,
    winRate:results.length?avg(results)*100:null,kda:avg(kda),
    damageGame:avg(damage),soulsMin:avg(souls),categories,
    counts:{winRate:results.length}};
}
function rankPlayers(good,referenceGood=null){
  const prepare=item=>{
    const scoped=item.p!=null;
    const row=scoped?rankingStats(item.p,item.matches):rankingStats(item);
    if(scoped)row.heroId=item.heroId;
    row.placement=scoped?placementForMatches(item.matches):placementForPlayer(item);
    return row;
  };
  const rows=good.map(prepare);
  // Trend windows use the same full-history peers rather than moving benchmarks.
  const referenceRows=referenceGood?referenceGood.map(prepare):rows;
  rows.forEach(row=>{
    let performanceTotal=0,performanceWeight=0;
    row.categoryDetails=[];
    CHEM_STATS.forEach(([name,,,items],categoryIndex)=>{
      const metricDetails=items.flatMap(([label,,,direction,weight],metricIndex)=>{
        if(!direction||!weight)return[];
        const x=row.categories[categoryIndex].values[metricIndex];
        if(!x)return[];
        const comparisons=referenceRows.flatMap(other=>{
          if(other===row||(referenceGood&&other.p===row.p&&other.heroId===row.heroId))return[];
          const y=other.categories[categoryIndex].values[metricIndex];
          if(!y)return[];
          const confidence=Math.min(x.count,y.count)/(Math.min(x.count,y.count)+10);
          return [{score:50+25*direction*(x.mean-y.mean)/Math.max(Math.abs(x.mean),Math.abs(y.mean),1)*confidence,
            peerMean:y.mean,peerCount:y.count}];
        });
        return comparisons.length?[{label,direction,weight,mean:x.mean,count:x.count,peerMean:validAvg(comparisons.map(c=>c.peerMean)),
          peerCount:Math.min(...comparisons.map(c=>c.peerCount)),peers:comparisons.length,
          score:validAvg(comparisons.map(c=>c.score))}]:[];
      });
      if(!metricDetails.length)return;
      const metricTotal=metricDetails.reduce((sum,m)=>sum+m.weight,0);
      metricDetails.forEach(m=>{m.effectiveWeight=m.weight/metricTotal*100;});
      const w=CHEM_WEIGHTS[name],categoryScore=weightedMetricScore(metricDetails);
      row.categoryDetails.push({name,baseWeight:w,rawScore:categoryScore,metrics:metricDetails});
      if(name!=='Support'){performanceTotal+=w*categoryScore;performanceWeight+=w;}
    });
    row.categoryDetails.forEach(c=>{c.effectiveWeight=performanceWeight?c.baseWeight/performanceWeight*100:0;});
    row.performanceCoverage={games:row.n,details:row.matches.filter(m=>m._detail).length};
    // The paired Chemistry formula and sample prior compress metrics near 50,
    // whereas win standing is a full percentile. Stretch metrics before the
    // 70/20/10 blend so the 10% win component cannot dominate close comparisons.
    const rawPerformance=performanceWeight?performanceTotal/performanceWeight:null;
    row.rawPerformance=rawPerformance;
    row.metricCorePerformance=rawPerformance==null?null:scalePerformanceScore(rawPerformance);
    row.supportScore=row.categoryDetails.find(c=>c.name==='Support')?.rawScore??null;
    row.supportBonus=row.metricCorePerformance==null?0:supportBonus(row.supportScore);
    row.metricPerformance=row.metricCorePerformance==null?null:Math.min(100,row.metricCorePerformance+row.supportBonus);
    const x=row.placement;
    const placementComparisons=referenceRows.flatMap(other=>{
      const y=other.placement;
      if(other===row||(referenceGood&&other.p===row.p&&other.heroId===row.heroId)||!x.count||!y.count)return [];
      const confidence=Math.min(x.count,y.count)/(Math.min(x.count,y.count)+10);
      return [50+25*(y.average-x.average)/Math.max(Math.abs(x.average),Math.abs(y.average),1)*confidence];
    });
    const placementRaw=validAvg(placementComparisons);
    // Coverage shrinks placement's standing toward neutral, but no longer changes
    // its 20% overall weight or the 70% weight of available stat metrics.
    row.placementScore=placementRaw==null?null:50+(scalePerformanceScore(placementRaw)-50)*x.count/x.selected;
    if(row.winRate!=null){
      const peers=referenceRows.filter(other=>other.winRate!=null);
      const below=peers.filter(other=>other.winRate<row.winRate).length;
      const tied=peers.filter(other=>other.winRate===row.winRate).length;
      const percentile=peers.length===1?50:(below+(tied-1)/2)/(peers.length-1)*100;
      const confidence=row.counts.winRate/(row.counts.winRate+10);
      row.winStanding=50+(percentile-50)*confidence;
    }
    const parts=rankScoreParts(row.metricPerformance,row.placementScore,row.winStanding);
    row.scoreWeights=parts.weights;
    row.score=parts.score;
  });
  return rows.sort((a,b)=>(b.score??-1)-(a.score??-1)||b.n-a.n||a.p.label.localeCompare(b.p.label));
}
function bestHeroCandidates(players){
  return players.flatMap(p=>{
    const byHero=new Map();
    visibleMatches(p).forEach(m=>{
      const id=gn(m,'hero_id');
      if(id==null)return;
      const key=String(id);
      if(!byHero.has(key))byHero.set(key,[]);
      byHero.get(key).push(m);
    });
    if(!byHero.size)return [{p,heroId:null,matches:visibleMatches(p)}];
    const heroes=[...byHero].map(([heroId,matches])=>({p,heroId,matches}));
    const minimum=Math.min(10,visibleMatches(p).length);
    const eligible=heroes.filter(hero=>hero.matches.length>=minimum);
    // If a short history is split across heroes, still show this player:
    // compare their most-played heroes rather than allowing a one-game fluke.
    const most=Math.max(...heroes.map(hero=>hero.matches.length));
    return eligible.length?eligible:heroes.filter(hero=>hero.matches.length===most);
  });
}
function bestHeroRankings(players){
  const scored=rankPlayers(bestHeroCandidates(players)),best=new Map();
  // One common peer pool gives every hero a comparable end score. Never choose
  // by raw win rate or by re-scoring an already-selected (circular) shortlist.
  scored.forEach(row=>{if(!best.has(row.p))best.set(row.p,row);});
  return [...best.values()];
}
const RANK_TREND_MATCH_OPTIONS=[5,10,15,20,30],RANK_TREND_FLAT=1;
function rankingScoreTrends(ranked,referenceGood,windowSize=rankTrendMatches){
  const windows=ranked.map(r=>{
    const matches=[...r.matches].filter(m=>gn(m,'start_time')!=null)
      .sort((a,b)=>gn(b,'start_time')-gn(a,'start_time'));
    if(matches.length<2*windowSize)return null;
    const scoped=r.heroId!==undefined;
    const item=ms=>scoped?{p:r.p,heroId:r.heroId,matches:ms}: {p:r.p,matches:ms};
    return {recent:item(matches.slice(0,windowSize)),older:item(matches.slice(windowSize,2*windowSize))};
  });
  const eligible=windows.filter(Boolean);
  const trends=new Map();
  if(!eligible.length)return trends;
  const recent=rankPlayers(eligible.map(w=>w.recent),referenceGood);
  const older=rankPlayers(eligible.map(w=>w.older),referenceGood);
  const byPlayer=rows=>new Map(rows.map(row=>[row.p,row]));
  const latest=byPlayer(recent),previous=byPlayer(older);
  ranked.forEach((r,i)=>{
    if(!windows[i])return;
    const a=latest.get(r.p),b=previous.get(r.p),minCoverage=Math.ceil(windowSize*.8);
    // Avoid implying precision when the detailed stat sample or estimated
    // placement coverage is sparse, or a component exists in only one window.
    if([a,b].some(row=>row.score==null||row.metricPerformance==null||row.winStanding==null||
      row.performanceCoverage.details<minCoverage||row.placement.count>0&&row.placement.count<minCoverage)||
      (a.placementScore==null)!==(b.placementScore==null))return;
    trends.set(r.p,{recent:a.score,older:b.score,delta:a.score-b.score,matches:windowSize,
      recentRow:a,olderRow:b,recentMatches:windows[i].recent.matches,olderMatches:windows[i].older.matches});
  });
  return trends;
}
function scoreTrendHtml(trend,index,p){
  if(!trend){
    const label=`Trend unavailable: need ${2*rankTrendMatches} matches in the selected period with sufficient data`;
    return `<span class="rank-score-trend" role="img" aria-label="${label}" title="${label}">—</span>`;
  }
  const direction=trend.delta>=RANK_TREND_FLAT?'up':trend.delta<=-RANK_TREND_FLAT?'down':'flat';
  const magnitude=Math.abs(trend.delta),strength=magnitude>=6?'strong':magnitude>=3?'medium':'soft';
  const label=`Score trend ${trend.delta>=0?'+':''}${f1(trend.delta)} points (${direction==='flat'?'flat':strength==='strong'?'large':strength==='medium'?'moderate':'small'} ${direction==='flat'?'change':direction==='up'?'increase':'decrease'}): last ${trend.matches??rankTrendMatches} matches ${f1(trend.recent)} vs previous ${trend.matches??rankTrendMatches} ${f1(trend.older)}; show trend breakdown for ${p.label}`;
  return `<button type="button" class="rank-score-trend ${direction} ${strength}" data-rank-trend="${index}" data-rank-trend-person="${chemText(String(p.id))}" aria-expanded="false" aria-controls="rank-trend-detail-${index}" aria-label="${chemText(label)}" title="${chemText(label)}">${direction==='up'?'↑':direction==='down'?'↓':'→'}</button>`;
}
function rankingTrendExplanation(trend,index=0){
  const {olderRow:old,recentRow:now,olderMatches,recentMatches}=trend,windowSize=trend.matches??rankTrendMatches;
  const signed=n=>`${n>=0?'+':'−'}${f1(Math.abs(n))}`;
  const kind=n=>n>=RANK_TREND_FLAT?'up':n<=-RANK_TREND_FLAT?'down':'';
  const components=[
    {name:'Stat performance',old:old.metricPerformance,now:now.metricPerformance,weight:now.scoreWeights.metric,
      detail:`Support bonus ${f1(old.supportBonus)} → ${f1(now.supportBonus)} stat pts`},
    {name:'Estimated placement',old:old.placementScore,now:now.placementScore,weight:now.scoreWeights.placement,
      detail:`Avg place ${f1(old.placement.average)} → ${f1(now.placement.average)} (lower is better) · coverage ${old.placement.count}/${windowSize} → ${now.placement.count}/${windowSize}`},
    {name:'Win standing',old:old.winStanding,now:now.winStanding,weight:now.scoreWeights.win,
      detail:`Win rate ${f1(old.winRate)}% → ${f1(now.winRate)}%`},

      return `<div class="rank-trend-factor-row"><span>${label}</span><div class="rank-trend-factor-track" role="img" aria-label="${c.name} ${label.toLowerCase()}: ${f1(points)} of ${f1(c.weight)} possible score points"><span class="rank-trend-factor-fill ${style}" style="width:${Math.max(0,Math.min(100,points/c.weight*100))}%"></span></div><strong>${f1(points)}</strong></div>`;
    };

  }).join('');

    const metricNames=[...new Set([...(a?.metrics||[]),...(b?.metrics||[])].map(m=>m.label))];
    const metricCards=metricNames.map(label=>{

    }).join('');

    return {delta,html:`<div class="rank-trend-category" style="--trend-category:${color||'var(--acc3)'}"><button type="button" class="rank-trend-cat-toggle" data-rank-trend-cat="${key}" aria-expanded="false" aria-controls="${panelId}" aria-label="Show ${chemText(name)} score trend metrics"><strong>${chemText(name)}</strong><small>${name==='Support'?'Bonus · ':''}${metricNames.length} ${metricNames.length===1?'metric':'metrics'}</small><span class="rank-trend-cat-change rank-trend-number ${delta==null?'':kind(delta)}">${delta==null?'—':signed(delta)}${delta==null?'':' peer pts'}</span></button><div class="rank-trend-category-scores">${bar('Previous',a?.rawScore,'old')}${bar('Latest',b?.rawScore,'new '+(delta==null?'flat':kind(delta)||'flat'))}</div><div id="${panelId}" class="rank-trend-metrics" hidden>${metricCards}</div></div>`};
  }).filter(Boolean).sort((a,b)=>Math.abs(b.delta??0)-Math.abs(a.delta??0)).map(c=>c.html).join('');
  const scoreBar=(name,score,style)=>`<div class="rank-trend-score-row"><span>${name}</span><div class="rank-trend-score-track" role="img" aria-label="${name} score ${f1(score)} out of 100"><span class="rank-trend-score-fill ${style}" style="width:${Math.max(0,Math.min(100,score))}%"></span></div><strong>${f1(score)}</strong></div>`;
  const gameHeading=(label,row)=>`<div class="rank-trend-games-head"><h4>${label} games · oldest → newest</h4><strong>Win rate ${row.winRate==null?'—':f1(row.winRate)+'%'}${row.counts?.winRate!=null&&row.counts.winRate<windowSize?` · ${row.counts.winRate}/${windowSize} results`:''}</strong></div>`;
  const gameStrip=(matches,label)=>`<div class="rank-trend-games-scroll"><div class="rank-trend-games" role="list" aria-label="${label} matches, oldest to newest">${[...matches].reverse().map((m,i)=>{

    const place=placementForMatch(m),k=gn(m,'player_kills'),d=gn(m,'player_deaths'),a=gn(m,'player_assists');
    const details=`${label} match ${i+1}: ${outcome==='?'?'result unavailable':outcome==='W'?'win':'loss'}, estimated place ${place??'unavailable'}, K/D/A ${k??'—'}/${d??'—'}/${a??'—'}`;
    return `<div class="rank-trend-game ${outcome==='W'?'win':outcome==='L'?'loss':''}" role="listitem" aria-label="${details}" title="${details}">${outcome}<small>#${i+1} · ${place==null?'—':'#'+place}</small></div>`;
  }).join('')}</div></div>`;
  return `<section class="rank-trend-panel" aria-label="Score trend breakdown for ${chemText(now.p.label)}"><h3>${chemText(now.p.label)} · last ${windowSize} vs previous ${windowSize} matches</h3><div class="rank-trend-summary ${kind(trend.delta)}">${signed(trend.delta)} score points</div><p class="note">Both ${windowSize}-game windows use the same full-history peer reference. This is a comparison of window scores, not a change to the full-history leaderboard score.</p><div class="rank-trend-scores">${scoreBar('Previous '+windowSize,trend.older,'previous')}${scoreBar('Latest '+windowSize,trend.recent,'recent '+(kind(trend.delta)||'flat'))}</div><h4>What changed the score</h4><p class="note">Each pair shows its actual contribution to the overall score. The end of a bar is that component’s maximum weighted points; the difference between its bars is the score change shown at right.</p><div class="rank-trend-factors">${factors}</div><h4>Stat categories · peer-relative scores</h4><p class="note">Category changes explain the stat component; peer-score shifts are not additional score points.</p><div class="rank-trend-categories">${categoryCards||'<p class="note">No scored categories available.</p>'}</div>${gameHeading('Previous '+windowSize,old)}${gameStrip(olderMatches,'Previous '+windowSize)}${gameHeading('Latest '+windowSize,now)}${gameStrip(recentMatches,'Latest '+windowSize)}<p class="note">W/L is match result; # is estimated lobby placement (— if unavailable). Match strips provide context, not individual game scores.</p></section>`;
}
function assignRankingTiers(rows){
  const graded=rows.filter(r=>r.score!=null);
  const gaps=graded.slice(1).map((r,i)=>({index:i+1,size:graded[i].score-r.score}));
  const positive=gaps.map(g=>g.size).filter(g=>g>0).sort((a,b)=>a-b);
  const mid=Math.floor(positive.length/2);
  const typical=positive.length?(positive.length%2?positive[mid]:(positive[mid-1]+positive[mid])/2):0;
  // Scores cluster near 50 after sample shrinkage. Split at meaningful *relative*
  // gaps rather than requiring an absolute 8-point jump (which left seven of nine in S).
  // Never split ties, and bound the number of tiers for small leaderboards.
  const minGap=Math.max(1.5,typical);
  const maxCuts=Math.min(5,Math.floor(graded.length/2));
  const cuts=new Set(gaps.filter(g=>g.size>=minGap)
    .sort((a,b)=>b.size-a.size||a.index-b.index).slice(0,maxCuts).map(g=>g.index));
  const letters='SABCDF';
  let group=0;
  rows.forEach((r,i)=>{
    if(r.score==null){r.tier=null;return;}
    if(cuts.has(i))group++;
    r.tier=letters[group];
  });
  return rows;
}

function heroStatsForPlayer(p){
  const byHero={};
  visibleMatches(p).forEach(m=>{
    const hid=gf(m,'hero_id');if(!hid)return;
    if(!byHero[hid])byHero[hid]={hid,player:p,m:0,w:0,k:0,d:0,a:0,nw:0,lh:0,dn:0,lvl:0,dmg:0,dmgGames:0,soulsValues:[],matches:[]};
    const hr=byHero[hid];
    hr.m++;hr.matches.push(m);
    if(isWin(m))hr.w++;
    hr.k+=gf(m,'player_kills');
    hr.d+=gf(m,'player_deaths');
    hr.a+=gf(m,'player_assists');
    hr.nw+=gf(m,'net_worth');
    const damage=gn(m,'player_damage');
    if(damage!=null){hr.dmg+=damage;hr.dmgGames++;}
    const duration=gn(m,'match_duration_s'),netWorth=gn(m,'net_worth');
    if(duration>0&&netWorth!=null)hr.soulsValues.push(netWorth*60/duration);
    hr.lh+=gf(m,'last_hits');
    hr.dn+=gf(m,'denies');
    hr.lvl+=gf(m,'hero_level');
  });
  return Object.values(byHero).map(hr=>{
    hr.l=hr.m-hr.w;
    hr.wr=hr.m?hr.w/hr.m*100:0;
    hr.kda=hr.d?(hr.k+hr.a)/hr.d:(hr.k+hr.a);
    hr.kg=hr.k/hr.m;hr.dg=hr.d/hr.m;hr.ag=hr.a/hr.m;
    hr.dmgGame=hr.dmgGames?hr.dmg/hr.dmgGames:null;
    hr.soulsMin=validAvg(hr.soulsValues);
    hr.nwg=hr.nw/hr.m;hr.lhg=hr.lh/hr.m;hr.dng=hr.dn/hr.m;hr.lvlg=hr.lvl/hr.m;
    hr.placement=placementForMatches(hr.matches);
    delete hr.matches;
    return hr;
  });
}

function sortHeroStats(rows){
  const minGames=3;
  const val={
    played:x=>x.m,
    winrate:x=>x.m>=minGames?x.wr:-1,
    kda:x=>x.m>=minGames?x.kda:-1,
    damage:x=>x.m>=minGames?(x.dmgGame??-1):-1,
    souls:x=>x.m>=minGames?(x.soulsMin??-1):-1,
    economy:x=>x.nwg,
    placement:x=>x.placement.count?-x.placement.average:-13
  }[heroSort]||((x)=>x.m);
  return [...rows].sort((a,b)=>val(b)-val(a)||
    (heroSort==='placement'?b.placement.count-a.placement.count:0)||b.m-a.m||b.wr-a.wr);
}

async function loadMatchBreakdown(id){
  if(matchBreakdowns.has(id)||matchBreakdownPending.has(id)||!window.BreadlockPlacement)return;
  const generation=loadGeneration;
  matchBreakdownPending.add(id);matchBreakdownErrors.delete(id);
  if(activeTab==='matches')renderMain();
  try{
    const rows=await BreadlockData.metadata([id],PLACEMENT_METADATA_OPTIONS,{priority:0});
    if(generation!==loadGeneration)return;
    const row=rows.find(x=>String(x.match_id)===id);
    if(!row)throw Error('Match metadata unavailable');
    const match=BreadlockPlacement.fromBulkMetadata(row,heroMeta);
    const result=BreadlockPlacement.scoreMatch(match);
    rememberMatchBreakdown(id,{row,match,result});
    void loadMatchNames(id);
    // An on-demand request can also finish before the background placement batch.
    placementRanks.set(id,Object.fromEntries(result.map(x=>[String(x.heroId),x.rank])));
    if(++placementUnsaved>=24)flushPlacementRanks();
    applyBulkMatchDetails(row);
  }catch(e){if(generation===loadGeneration)matchBreakdownErrors.set(id,String(e));}
  finally{
    matchBreakdownPending.delete(id);
    if(generation===loadGeneration&&activeTab==='matches')renderMain();
  }
}
async function loadMatchNames(id,refresh=false){
  const data=matchBreakdowns.get(id);
  if(!data||matchNamesPending.has(id)||(!refresh&&matchNamesLoaded.has(id)))return;
  const generation=loadGeneration;
  const accounts=[...new Set(data.row.players.map(x=>typeof x==='string'?JSON.parse(x):x)
    .map(x=>String(x.account_id??'')).filter(x=>/^\d{1,10}$/.test(x)&&x!=='0'&&!steamNames.has(x)))];
  if(!accounts.length){matchNamesLoaded.add(id);return;}
  matchNamesPending.add(id);matchNamesErrors.delete(id);
  if(activeTab==='matches')renderMain();
  try{
    const q=new URLSearchParams({account_ids:accounts.join(',')});
    if(refresh)q.set('refresh','true');
    const profiles=await apiFetch('/players/steam?'+q,{ttl:refresh?0:6*60*60*1000,priority:0,staleOnError:!refresh});
    if(generation!==loadGeneration)return;
    if(!Array.isArray(profiles))throw Error('Invalid Steam profile response');
    for(const profile of profiles){
      const account=String(profile.account_id),name=profile.personaname;
      if(accounts.includes(account)&&typeof name==='string'&&name.trim())steamNames.set(account,name.trim());
    }
    matchNamesLoaded.add(id);
  }catch(e){if(generation===loadGeneration)matchNamesErrors.set(id,String(e));}
  finally{
    matchNamesPending.delete(id);
    if(generation===loadGeneration&&activeTab==='matches')renderMain();
  }
}
