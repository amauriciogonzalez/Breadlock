async function refreshTeamShare(){
  const key=scopeKey();await Promise.all(players.filter(p=>!p.loading&&!p.error).map(async p=>{
    p.rosterScope=p.rosterScope||new Set();if(p.rosterScope.has(key))return;
    p.rosterScope.add(key);
    p.teamSharePending=key;
    const ms=visibleMatches(p).slice(0,25).filter(m=>teamShare(m)==null);
    if(ms.length&&activeTab==='performance')renderMain();
    const accountId=String(p.matches?.find(m=>m.account_id!=null)?.account_id??p.id);
    let missing=0;
    try{
      for(let i=0;i<ms.length;i+=25){
        const slice=ms.slice(i,i+25),q=new URLSearchParams({match_ids:slice.map(m=>m.match_id).join(','),
          only_filtered_players:'false',include_info:'false',include_player_final_stats:'true',limit:String(slice.length)});
        const byId=new Map(slice.map(m=>[String(m.match_id),m]));
        if(!players.includes(p)||!p.rosterScope.has(key)){if(p.teamSharePending===key)p.teamSharePending=null;return;}
        const data=await BreadlockData.metadata(slice.map(m=>m.match_id),Object.fromEntries(q),{priority:0});
        if(!players.includes(p)||!p.rosterScope.has(key)){if(p.teamSharePending===key)p.teamSharePending=null;return;}
        for(const row of Array.isArray(data)?data:[]){
          const m=byId.get(String(row.match_id));if(!m||!Array.isArray(row.players)||row.players.length!==12)continue;
          const roster=row.players.map(x=>{if(typeof x!=='string')return x;try{return JSON.parse(x);}catch(e){return null;}});
          if(roster.some(x=>!x))continue;
          m._roster=roster;
          m._detail=roster.find(x=>String(x.account_id)===accountId)||
            roster.find(x=>Number(x.hero_id)===Number(m.hero_id))||m._detail;
        }
        missing+=slice.filter(m=>teamShare(m)==null).length;
      }
      if(missing)dbg(p.label+': team share unavailable for '+missing+'/'+ms.length+' selected matches','wn');
    }catch(e){dbg(p.label+' team shares unavailable: '+e,'wn');missing=ms.length;dataNotice='Full-team data is incomplete: '+e.message;}
    // Allow another attempt on a later Performance visit if the API omitted rows.
    if(missing)p.rosterScope.delete(key);
    if(p.teamSharePending===key)p.teamSharePending=null;
    if(players.includes(p))renderMain();
  }));
}

function populationWindow(){
  if(!scopeCount)return {from:0,label:'All available playerbase history'};
  if(scopeUnit==='days'){
    // Hourly cutoff keeps cache keys stable without drifting far from the global filter.
    return {from:Math.floor(Date.now()/3600000)*3600-scopeCount*86400,label:`Last ${scopeCount} days of playerbase matches`};
  }
  // The API cannot select the last N games per population player. Use one shared
  // date cutoff spanning the selected games of every loaded player instead.
  const times=players.filter(p=>!p.loading&&!p.error).flatMap(p=>visibleMatches(p).map(m=>gn(m,'start_time')).filter(t=>t>0));
  const from=times.length?Math.min(...times):0;

function populationPoints(data){
  if(!data)return null;
  const pts=IND_QUANTILES.map(q=>[Number(data['percentile'+q]),q/100]);

function populationCdf(points,value){
  if(value<points[0][0])return 0;
  if(value>points.at(-1)[0])return 1;
  // Flat quantiles represent a mass at zero (or another repeated value).
  // Place tied observations in the middle of that mass, not at an arbitrary edge.
  const ties=points.filter(([x])=>x===value);
  if(ties.length>1)return (ties[0][1]+ties.at(-1)[1])/2;
  for(let i=1;i<points.length;i++){
    const [hi,pHi]=points[i],[lo,pLo]=points[i-1];
    if(value<=hi)return hi===lo?pHi:pLo+(value-lo)/(hi-lo)*(pHi-pLo);
  }
  return 1;
}
function populationCurve(groups,value,fmt,top,playerColor){
  const lo=Math.min(...groups.map(g=>g.points[0][0])),hi=Math.max(...groups.map(g=>g.points.at(-1)[0]));
  const span=Math.max(hi-lo,1e-9),bins=40,step=span/bins;
  const cdf=x=>groups.reduce((s,g)=>s+g.weight*populationCdf(g.points,x),0);
  const bars=Array.from({length:bins},(_,i)=>Math.max(0,cdf(lo+(i+1)*step)-cdf(lo+i*step)));
  const peak=Math.max(...bars,0.001),xPos=value==null?null:Math.max(0,Math.min(100,(value-lo)/span*100));
  const path='M 0 90 '+bars.map((b,i)=>`L ${(i+.5)*100/bins} ${(90-b/peak*72).toFixed(1)}`).join(' ')+' L 100 90 Z';
  return `<div class="ind-plot">${xPos==null?'':`<span class="ind-percent" style="left:${xPos.toFixed(2)}%;transform:translateX(${xPos<15?'0':xPos>85?'-100%':'-50%'});color:${individualTopColor(top)}">Top ${top}%</span>`}<svg class="ind-chart" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Approximate playerbase match distribution${xPos==null?'':'; player average marked by a colored line, top '+top+' percent'}"><path d="${path}" fill="rgba(52,217,195,.27)" stroke="var(--teal)" stroke-width=".6" vector-effect="non-scaling-stroke"/>${xPos==null?'':`<line x1="${xPos.toFixed(2)}" x2="${xPos.toFixed(2)}" y1="0" y2="92" stroke="${playerColor}" stroke-width="2" vector-effect="non-scaling-stroke"/>`}<line x1="0" x2="100" y1="90" y2="90" stroke="var(--bdr2)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><div class="ind-axis"><span>${fmt(lo)}</span><span>${fmt(hi)}</span></div></div>`;
}
function individualTopColor(top){
  // Smooth green → yellow → orange → red as the top-percent number worsens.
  const stops=[[1,135],[25,95],[50,48],[75,25],[100,0]];

const STAGE_KEYS=['net_worth','creep_kills','denies','player_damage','kills','deaths'];
const STAGE_COLUMNS=['time_stamp_s',...STAGE_KEYS];
const STAGE_METADATA_OPTIONS={only_filtered_players:'true',include_info:'false',
  extra_player_columns:STAGE_COLUMNS.map(field=>'stats.'+field).join(',')};
function stageTimeline(player){
  if(Array.isArray(player.stats))return player.stats;
  const times=player.stats_time_stamp_s;
  if(!Array.isArray(times)||!times.length||STAGE_KEYS.some(key=>
    !Array.isArray(player['stats_'+key])||player['stats_'+key].length!==times.length))return [];
  return times.map((time,i)=>Object.fromEntries(STAGE_COLUMNS.map(key=>
    [key,key==='time_stamp_s'?time:player['stats_'+key][i]])));

function stageSnapshot(stats,time){
  const before=[...stats].reverse().find(x=>x.time_stamp_s<=time),after=stats.find(x=>x.time_stamp_s>=time);
  if(!before||!after||after.time_stamp_s-before.time_stamp_s>360)return null;
  const fraction=after.time_stamp_s===before.time_stamp_s?0:(time-before.time_stamp_s)/(after.time_stamp_s-before.time_stamp_s);
  return Object.fromEntries(STAGE_KEYS.map(key=>{
    const lo=gn(before,key),hi=gn(after,key);
    return [key,lo==null||hi==null?null:lo+(hi-lo)*fraction];
  }));

function matchStages(stats,duration){
  const sorted=stats.filter(x=>gn(x,'time_stamp_s')!=null).sort((a,b)=>a.time_stamp_s-b.time_stamp_s);
  const early=stageSnapshot(sorted,600);
  let late=null;
  if(duration>1200){
    const start=stageSnapshot(sorted,1200);
    const end=[...sorted].reverse().find(x=>x.time_stamp_s<=duration+60);
    if(start&&end&&end.time_stamp_s>1200&&duration-end.time_stamp_s<=360){
      const minutes=(end.time_stamp_s-1200)/60;
      late=Object.fromEntries(STAGE_KEYS.map(key=>{
        const from=start[key],to=gn(end,key);
        return [key,from==null||to==null?null:(to-from)/minutes];
      }));
    }
  }
  return early||late?{early,late}:null;
}

async function refreshStages(){
  // Timelines are optional: never queue them ahead of leaderboard histories,
  // placement rankings, or the overview's final-stat enrichment.
  if(activeTab!=='stages'||stagesWaitingForOverview())return;
  const key=scopeKey();await Promise.all(players.filter(p=>!p.loading&&!p.error).map(async p=>{
    p.stages=p.stages||{};if(Object.hasOwn(p.stages,key))return;
    const ms=[...visibleMatches(p)].filter(m=>gn(m,'match_duration_s')>=600)
      .sort((a,b)=>(gn(b,'start_time')||0)-(gn(a,'start_time')||0)).slice(0,STAGE_MATCH_LIMIT);
    p.stages[key]={loading:true,values:new Map(),done:0,total:ms.length};
    const bucket=p.stages[key];if(activeTab==='stages')renderMain();
    const byId=new Map(ms.map(m=>[String(m.match_id),m]));
    // Metadata filters use account32, even when the player was added by Steam64.
    const accountId=String(p.matches?.find(m=>m.account_id!=null)?.account_id??p.id);
    try{
      for(let i=0;i<ms.length;i+=25){
        const slice=ms.slice(i,i+25);
        if(p.stages[key]!==bucket||!players.includes(p))return;
        const data=await BreadlockData.metadata(slice.map(m=>m.match_id),
          {...STAGE_METADATA_OPTIONS,account_ids:accountId},{priority:2});
        if(p.stages[key]!==bucket||!players.includes(p))return;
        for(const row of Array.isArray(data)?data:[]){
          const player=(row.players||[]).map(x=>{if(typeof x!=='string')return x;try{return JSON.parse(x);}catch(e){return null;}})
            .find(x=>x&&String(x.account_id)===accountId);
          const stats=player&&stageTimeline(player);
          if(stats?.length){const v=matchStages(stats,gn(byId.get(String(row.match_id)),'match_duration_s'));if(v)bucket.values.set(String(row.match_id),v);}
        }
        bucket.done=Math.min(ms.length,i+slice.length);
        if(activeTab==='stages')renderMain();
      }
    }catch(e){dbg(p.label+' match-stage data unavailable: '+e,'wn');bucket.error=true;dataNotice='Match-stage data is incomplete: '+e.message;}
    if(p.stages[key]!==bucket||!players.includes(p))return;

  }));
}

// Each point averages one non-overlapping block of matches per player.
// The x position is the last match number in that block within the selected scope.
const PROGRESS_WINDOWS=[0,10,25,50,100,250]; // 0 = no averaging (one point per match)
const RANK_PROGRESS_SEASONS=[{id:'beta1',name:'Beta Season 1',start:Date.parse('2026-07-30T00:00:00Z')/1000,end:Infinity}];
let progressWindow=100,rankProgressWindow=0,rankProgressSeason='beta1';
const progressHiddenIds=new Set();
const progressLocalHidden=new Map(); // chart stat key -> hidden player IDs
const PROGRESS_STATS=[
  {key:'rank',title:'Official rank progression',series:progressRankSeries},
  {key:'win',title:'Win rate',unit:'%',value:m=>isWin(m)?100:0},
  {key:'kills',title:'Kills / match',value:m=>gn(m,'player_kills')},
  {key:'deaths',title:'Deaths / match',value:m=>gn(m,'player_deaths')},
  {key:'assists',title:'Assists / match',value:m=>gn(m,'player_assists')},
  {key:'kda',title:'KDA ratio',aggregate:ms=>{
    const valid=ms.filter(m=>['player_kills','player_deaths','player_assists'].every(key=>gn(m,key)!=null));
    if(!valid.length)return null;

    const deaths=valid.reduce((sum,m)=>sum+gn(m,'player_deaths'),0);

  }},
  {key:'souls',title:'Souls / min',value:m=>ratio(gn(m,'net_worth'),ratio(gn(m,'match_duration_s'),60))},
  {key:'damage',title:'Damage / min',value:m=>metrics(m).dpm},
  {key:'objective',title:'Boss damage / min',value:m=>ratio(metrics(m).boss,ratio(gn(m,'match_duration_s'),60))},
  {key:'placement',title:'Avg estimated placement (lower is better)',value:m=>placementForMatch(m)},
  {key:'creepDamage',title:'Lane creep damage / match',value:m=>metrics(m).creep},

function rankAxisLabel(value){

function progressRankSeries(p){
  const season=RANK_PROGRESS_SEASONS.find(s=>s.id===rankProgressSeason);
  if(!season)return [];
  const ranked=(p.matches||[]).filter(m=>{
    const time=gn(m,'start_time');
    return gn(m,'game_mode')===1&&gn(m,'match_mode')===4&&time!=null&&time>=season.start&&time<season.end;
  }).sort((a,b)=>gn(a,'start_time')-gn(b,'start_time'));

      const badge=gn(m,'ranked_display_badge'),tier=Math.floor(badge/10),sub=badge%10;
      return Number.isInteger(badge)&&tier>=1&&tier<=11&&sub>=1&&sub<=6?(tier-1)*6+sub:null;

function progressSeries(p,stat){

    .filter(row=>row.time!=null&&row.time>0&&Number.isFinite(row.time))
    .sort((a,b)=>a.time-b.time);
  const points=[];
  const size=progressWindow||1;
  for(let i=0;i<ms.length;i+=size){
    const end=Math.min(i+size,ms.length);
    const block=ms.slice(i,end).map(row=>row.m);

          syncProgressChart(legend.chart);
        }},
          tooltip:{callbacks:{title:items=>items.length?stat.key==='rank'?items[0].raw.start===items[0].parsed.x?`Ranked match #${items[0].parsed.x}`:`Ranked matches #${items[0].raw.start}–${items[0].parsed.x}`:items[0].raw.start===items[0].parsed.x?`Match #${items[0].parsed.x}`:`Matches #${items[0].raw.start}–${items[0].parsed.x}`:'',
            label:item=>`${item.dataset.label}: ${stat.key==='rank'?rankProgressWindow===0?rankAxisLabel(item.parsed.y):`${rankAxisLabel(Math.round(item.parsed.y))} (avg ${item.parsed.y.toFixed(1)} subdivisions)`:item.parsed.y.toFixed(1)+(stat.unit||'')}`}}},
        scales:{x:{type:'linear',...bounds.x,title:{display:true,text:stat.key==='rank'?'Ranked matches played':'Matches played',color:TICK},grid:{color:GRID},ticks:{color:TICK,maxTicksLimit:7,precision:0,callback:value=>Number.isInteger(value)?value:''}},
          y:{...bounds.y,grid:{color:GRID},ticks:{color:TICK,maxTicksLimit:stat.key==='rank'?7:11,...(stat.key==='rank'?{precision:0,font:{size:11}}:{}),
            callback:value=>stat.key==='rank'?rankAxisLabel(value):value+(stat.unit||'')}}},
        ...(stat.key==='rank'?{layout:{padding:{left:22}}}:{})
      },stat.key==='rank'?[progressRankSymbols]:[]);
    }
  }
  else if(activeTab==='combat'){
    const mK=Math.max(...arr.map(x=>x.s.kills))||1,mD=Math.max(...arr.map(x=>x.s.deaths))||1,
          minD=Math.min(...arr.map(x=>x.s.deaths)),dRange=mD-minD,
          mA=Math.max(...arr.map(x=>x.s.assists))||1,mSouls=Math.max(...arr.map(x=>x.s.soulsMin??0))||1,
          mKD=Math.max(...arr.map(x=>x.s.kd))||1,mKda=Math.max(...arr.map(x=>x.s.kda))||1;
    const rEl=document.getElementById('ch-radar');
    if(rEl)try{charts['ch-radar']=new Chart(rEl,{type:'radar',data:{
      labels:['Kills/G','Assists/G','KDA','K/D','Souls/min','1/Deaths/G'],
      datasets:arr.map(x=>({label:x.p.label,
        data:[x.s.kills/mK,x.s.assists/mA,x.s.kda/mKda,x.s.kd/mKD,(x.s.soulsMin??0)/mSouls,dRange?1-((x.s.deaths-minD)/dRange):1],
        borderColor:x.p.color,backgroundColor:x.p.color+'20',borderWidth:2,pointBackgroundColor:x.p.color,pointRadius:3
      }))
    },options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:TICK,boxWidth:9,font:{size:10}}}},
      scales:{r:{grid:{color:GRID},ticks:{display:false},pointLabels:{color:TICK,font:{size:10}}}}}});}catch(e){dbg('Chart err ch-radar: '+e,'er');}

    // KDA chart sorted by kills
    const kdaSorted=[...arr].sort((a,b)=>b.s.kills-a.s.kills);
    mk('ch-kda','bar',{labels:kdaSorted.map(x=>x.p.label),datasets:[
      {label:'Kills',data:kdaSorted.map(x=>x.s.kills),backgroundColor:'#5aee8a88',borderWidth:0,borderRadius:3},
      {label:'Deaths',data:kdaSorted.map(x=>x.s.deaths),backgroundColor:'#ff707088',borderWidth:0,borderRadius:3},
      {label:'Assists',data:kdaSorted.map(x=>x.s.assists),backgroundColor:'#74b3ff88',borderWidth:0,borderRadius:3},
    ]},{plugins:{legend:{display:true,labels:{color:TICK,boxWidth:9,font:{size:10}}}}});
  }
  else if(activeTab==='economy'){
    const maxVal=key=>Math.max(...arr.map(x=>x.s[key]??0))||1;
    const mSouls=maxVal('soulsMin'),mNw=maxVal('avgNw'),mLh=maxVal('avgLh'),
          mDen=maxVal('avgDen'),mLvl=maxVal('avgLvl'),mDmg=maxVal('damageGame');
    const rEl=document.getElementById('ch-eco-radar');
    if(rEl)try{charts['ch-eco-radar']=new Chart(rEl,{type:'radar',data:{
      labels:['Souls/min','Avg Net Worth','Last Hits/G','Denies/G','Avg Level','Damage/G'],
      datasets:arr.map(x=>({label:x.p.label,
        data:[(x.s.soulsMin??0)/mSouls,x.s.avgNw/mNw,x.s.avgLh/mLh,x.s.avgDen/mDen,x.s.avgLvl/mLvl,(x.s.damageGame??0)/mDmg],
        borderColor:x.p.color,backgroundColor:x.p.color+'20',borderWidth:2,pointBackgroundColor:x.p.color,pointRadius:3
      }))
    },options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:TICK,boxWidth:9,font:{size:10}}}},
      scales:{r:{grid:{color:GRID},ticks:{display:false},pointLabels:{color:TICK,font:{size:10}}}}}});}catch(e){dbg('Chart err ch-eco-radar: '+e,'er');}
  }
}

// Init
function init(){
  document.getElementById('main').addEventListener('click',e=>{
    const toggle=e.target.closest('.match-toggle'),retry=e.target.closest('.match-retry'),names=e.target.closest('.match-names-refresh'),pager=e.target.closest('button[data-match-page]');
    if(pager){
      const player=players.find(p=>p.id===pager.dataset.matchPlayer);
      if(!player||player.loading||player.error)return;
      const total=visibleMatches(player).length,page=Number(pager.dataset.matchPage);
      if(!Number.isInteger(page)||page<0||page>=Math.ceil(total/MATCHES_PAGE_SIZE))return;
      matchPages.set(player.id,page);openMatchIds.clear();renderMain();void refreshMatchAvgBadges();
      [...document.querySelectorAll('.match-page-status')].find(x=>x.dataset.matchPlayer===player.id)?.focus();
    }else if(toggle){
      const id=toggle.dataset.matchId,playerId=toggle.dataset.matchPlayer,key=matchOpenKey(playerId,id);
      if(openMatchIds.has(key))openMatchIds.delete(key);
      else{openMatchIds.add(key);loadMatchBreakdown(id);void loadMatchNames(id);}
      renderMain();
      [...document.querySelectorAll('.match-toggle')].find(b=>b.dataset.matchId===id&&b.dataset.matchPlayer===playerId)?.focus();
    }else if(retry)loadMatchBreakdown(retry.dataset.matchId);
    else if(names)void loadMatchNames(names.dataset.matchId,true);
  });
  document.getElementById('btn-add').addEventListener('click',()=>{
    const id=document.getElementById('inp-id').value.trim();
    const nm=document.getElementById('inp-nm').value.trim();
    if(!id)return;
    if(!/^\d{1,20}$/.test(id)){
      dbg('Enter a numeric Steam account ID (up to 20 digits).','wn');
      document.getElementById('inp-id').setCustomValidity('Enter a numeric Steam account ID (up to 20 digits).');
      document.getElementById('inp-id').reportValidity();
      return;
    }
    document.getElementById('inp-id').setCustomValidity('');
    document.getElementById('inp-id').value='';
    document.getElementById('inp-nm').value='';
    loadHeroMeta();addPlayer(id,nm);
  });
  document.getElementById('inp-id').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-add').click();});
  document.getElementById('btn-def').addEventListener('click',()=>{
    loadHeroMeta();DEFAULTS.forEach(d=>{if(!players.find(p=>p.id===d.id))addPlayer(d.id,d.label,d.color);});
  });
  document.getElementById('btn-clr').addEventListener('click',()=>{
    loadGeneration++;cancelPlacements();
    placementRanks.clear();placementFailures.clear();playerRanks.clear();rankPending.clear();matchAvgBadges.clear();matchAvgPending.clear();matchBreakdowns.clear();openMatchIds.clear();matchPages.clear();matchBreakdownErrors.clear();steamNames.clear();matchNamesLoaded.clear();matchNamesErrors.clear();placementUnsaved=0;dataNotice='';
    try{localStorage.removeItem(PLACEMENT_CACHE_KEY);}catch(e){dbg('Placement cache could not be cleared: '+e,'wn');}
    players=[];progressHiddenIds.clear();progressLocalHidden.clear();Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};
    renderChips();renderMain();
  });
  document.getElementById('btn-dbg').addEventListener('click',()=>{
    document.querySelector('.tab[data-t="debug"]').click();
  });
  document.querySelectorAll('.filters select').forEach(select=>select.addEventListener('change',()=>{
    cancelPlacements();matchPages.clear();openMatchIds.clear();scopeMode=document.getElementById('scope-mode').value;
    scopeCount=+document.getElementById('scope-count').value;
    scopeUnit=document.getElementById('scope-unit').value;
    renderMain();void refreshMatchAvgBadges();schedulePlacements();refreshMvp();
    if(activeTab==='stages')void refreshStages();
    if(activeTab==='performance')refreshTeamShare();
    if(activeTab==='individual')refreshIndividual();
  }));
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    activeTab=t.dataset.t;
    document.querySelectorAll('.tab').forEach(x=>{
      x.classList.toggle('on',x===t);
      x.setAttribute('aria-selected',String(x===t));
    });
    renderMain();if(activeTab==='matches')void refreshMatchAvgBadges();if(activeTab==='stages')void refreshStages();if(activeTab==='performance')refreshTeamShare();if(activeTab==='individual')refreshIndividual();
    if(activeTab==='progress')void loadRankAssets().then(()=>{if(activeTab==='progress')charts['progress-rank']?.draw();});
  }));
  dbg('Breadlock Stats ready','ok');
}
init();
})();
</script>
